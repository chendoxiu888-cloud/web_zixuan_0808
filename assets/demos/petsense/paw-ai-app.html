/* ============================== ICONS (dependency-free) ==============================
   Small hand-drawn line icons (stroke-based, lucide-like) so this file has zero
   external icon dependency. Each is a tiny component with the same name the app
   already references, so the rest of the code needs no changes.
======================================================================================== */
function Ico({ children, size = 18, color = "currentColor", style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
      {children}
    </svg>
  );
}

function HeartPulse(p) { return <Ico {...p}><path d="M3 12h4l1.5-3L11 15l2-8 1.5 5H21" /></Ico>; }

/* ============================== DEPENDENCY-FREE MINI BAR CHART ============================== */
function MiniBarChart({ data, height = 150 }) {
  const max = Math.max(...data.map((d) => d.v)) * 1.18;
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height, position: "relative" }}>
      {[0, 1, 2, 3].map((i) => (
        <div key={i} style={{ position: "absolute", left: 0, right: 0, bottom: (height / 3) * i, height: 1, background: "rgba(10,10,11,0.06)" }} />
      ))}
      {data.map((d, i) => (
        <div key={i} title={String(d.v)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%", position: "relative", zIndex: 1 }}>
          <div style={{ width: "68%", height: Math.max(4, (d.v / max) * height), background: d.today ? C.primary : "rgba(10,10,11,0.14)", borderRadius: "7px 7px 0 0", transition: "height .3s" }} />
          <div style={{ fontSize: 11, color: C.subtle, marginTop: 6 }}>{d.day}</div>
        </div>
      ))}
    </div>
  );
}


/* ============================== DESIGN TOKENS ==============================
   Monochrome editorial: pure greyscale, no hue anywhere. Depth comes from
   translucency and blur rather than colour. Two surface tiers:
     glass()  — Liquid Glass: translucent, blurred, specular top edge + inner
                rim light, so it refracts whatever scrolls beneath it.
     frost()  — heavier frosted panel for sheets and bars that must stay legible.
   Status is carried by luminance (near-black = active, mid-grey = idle).
============================================================================ */
const C = {
  /* Greyscale skeleton — carries structure, text, controls. */
  text: "#0E1113",
  sub: "#6B7378",
  subtle: "#A2A9AD",
  primary: "#14181A",          /* near-black pills & selected nav, like ref 1 */
  primaryDeep: "#000000",
  primaryTint: "rgba(14,17,19,0.06)",

  /* Mint — the single brand accent. Health, progress, "alive" states. */
  mint: "#12A06B",
  mintSoft: "#3FC08C",
  mintTint: "rgba(18,160,107,0.12)",

  /* Aliases kept so existing call sites pick up the accent automatically. */
  sage: "#12A06B",
  sageTint: "rgba(18,160,107,0.12)",
  gold: "#8A9296",
  goldTint: "rgba(14,17,19,0.07)",

  /* Status — muted, used sparingly the way ref 1 uses its single red. */
  warn: "#B0803A",
  warnTint: "rgba(176,128,58,0.13)",
  danger: "#D9484D",
  dangerTint: "rgba(217,72,77,0.11)",

  hair: "rgba(14,17,19,0.08)",
  canvas: "#EFF1F1",
  card: "rgba(255,255,255,0.62)",
  glass: "rgba(255,255,255,0.62)",
  glassStrong: "rgba(255,255,255,0.80)",
  glassBorder: "rgba(255,255,255,0.55)",
  shadow: "0 8px 30px rgba(14,17,19,0.09)",
};

/* Neutral light-field with the faintest mint bloom — gives the glass something
   to refract without tinting the whole UI green. */
const AURORA_BG = {
  backgroundImage: `
    radial-gradient(at 12% 8%,  rgba(255,255,255,0.95) 0px, transparent 55%),
    radial-gradient(at 86% 6%,  rgba(200,228,215,0.50) 0px, transparent 52%),
    radial-gradient(at 8%  86%, rgba(178,184,186,0.38) 0px, transparent 50%),
    radial-gradient(at 94% 92%, rgba(206,224,216,0.55) 0px, transparent 55%),
    linear-gradient(180deg, #F4F6F5 0%, #E6EAE9 100%)
  `,
};

/* ---- Liquid Glass -------------------------------------------------------
   Apple's material reads as glass because of three cues layered together:
   (1) backdrop blur + saturation boost, (2) a bright specular line along the
   top edge, (3) an inner rim light that wraps the lower inside edge. The
   box-shadow below stacks an outer drop shadow with two inset highlights to
   produce all three without any images.
-------------------------------------------------------------------------- */
function glass(radius = 22, extra = {}) {
  return {
    background: "linear-gradient(160deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.44) 52%, rgba(255,255,255,0.58) 100%)",
    backdropFilter: "blur(26px) saturate(180%)",
    WebkitBackdropFilter: "blur(26px) saturate(180%)",
    border: "1px solid rgba(255,255,255,0.6)",
    borderRadius: radius,
    boxShadow: [
      "0 8px 30px rgba(10,10,11,0.09)",
      "inset 0 1px 0 rgba(255,255,255,0.95)",
      "inset 0 -1px 1px rgba(255,255,255,0.45)",
    ].join(","),
    ...extra,
  };
}

/* Heavier frosted panel — sheets, bars, anything overlaying dense content. */
function frost(radius = 22, extra = {}) {
  return {
    background: "rgba(246,246,248,0.74)",
    backdropFilter: "blur(40px) saturate(190%)",
    WebkitBackdropFilter: "blur(40px) saturate(190%)",
    border: "1px solid rgba(255,255,255,0.5)",
    borderRadius: radius,
    boxShadow: "0 -8px 40px rgba(10,10,11,0.12), inset 0 1px 0 rgba(255,255,255,0.9)",
    ...extra,
  };
}

/* Near-black pill, the single high-contrast control. */
function pill(extra = {}) {
  return {
    background: C.primary,
    color: "#FFFFFF",
    border: "none",
    borderRadius: 999,
    boxShadow: "0 6px 20px rgba(10,10,11,0.28), inset 0 1px 0 rgba(255,255,255,0.18)",
    cursor: "pointer",
    ...extra,
  };
}

/* ============================== PET AVATAR ==============================
   Real photos can't be generated here, and pulling one off the web would drag
   licensing into your portfolio. So the avatar is a real upload target: tap it,
   pick a photo, the browser reads it to a data URL and it renders immediately —
   no server, no rights problem. Until then a hand-drawn greyscale cat stands in.
========================================================================= */
function VectorCat({ size }) {
  return (
    <svg viewBox="0 0 100 100" width={size} height={size} style={{ display: "block" }}>
      <defs>
        <linearGradient id="furG" x1="0.3" y1="0" x2="0.7" y2="1">
          <stop offset="0%" stopColor="#F2F2F4" /><stop offset="55%" stopColor="#CFD1D6" /><stop offset="100%" stopColor="#9EA1A8" />
        </linearGradient>
        <linearGradient id="earG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#B9BCC2" /><stop offset="100%" stopColor="#8E9198" />
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="50" fill="#E6E7EA" />
      <path d="M24 40 L18 14 L40 27 Z" fill="url(#earG)" />
      <path d="M76 40 L82 14 L60 27 Z" fill="url(#earG)" />
      <path d="M26 38 L23 22 L36 30 Z" fill="#7E8189" opacity=".55" />
      <path d="M74 38 L77 22 L64 30 Z" fill="#7E8189" opacity=".55" />
      <ellipse cx="50" cy="54" rx="31" ry="28" fill="url(#furG)" />
      <ellipse cx="39" cy="49" rx="4.6" ry="5.6" fill="#1A1B1D" />
      <ellipse cx="61" cy="49" rx="4.6" ry="5.6" fill="#1A1B1D" />
      <ellipse cx="40.4" cy="47" rx="1.6" ry="1.9" fill="#fff" opacity=".9" />
      <ellipse cx="62.4" cy="47" rx="1.6" ry="1.9" fill="#fff" opacity=".9" />
      <path d="M46.5 61 L53.5 61 L50 65.5 Z" fill="#6E7075" />
      <path d="M50 65.5 Q45 71 39.5 67.5" stroke="#7E8189" strokeWidth="1.7" fill="none" strokeLinecap="round" />
      <path d="M50 65.5 Q55 71 60.5 67.5" stroke="#7E8189" strokeWidth="1.7" fill="none" strokeLinecap="round" />
      <g stroke="#B9BCC2" strokeWidth="1.2" strokeLinecap="round" opacity=".85">
        <path d="M22 56 L7 53" /><path d="M22 60 L7 61" />
        <path d="M78 56 L93 53" /><path d="M78 60 L93 61" />
      </g>
    </svg>
  );
}

function PetAvatar({ pet, size = 52, onUpload, editable = true }) {
  const inputRef = useRef(null);
  const pick = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f || !onUpload) return;
    const r = new FileReader();
    r.onload = () => onUpload(r.result);
    r.readAsDataURL(f);
  };
  return (
    <div
      onClick={editable && onUpload ? () => inputRef.current && inputRef.current.click() : undefined}
      title={editable && onUpload ? "点击上传宠物照片" : undefined}
      style={{
        width: size, height: size, borderRadius: "50%", overflow: "hidden", flexShrink: 0,
        position: "relative", cursor: editable && onUpload ? "pointer" : "default",
        background: "rgba(255,255,255,0.5)",
        boxShadow: "0 2px 10px rgba(10,10,11,0.12), inset 0 0 0 1px rgba(255,255,255,0.75)",
      }}
    >
      {pet.photo
        ? <img src={pet.photo} alt={pet.name} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
        : <VectorCat size={size} />}
      {editable && onUpload && (
        <>
          <div style={{
            position: "absolute", left: 0, right: 0, bottom: 0, height: size * 0.3,
            background: "linear-gradient(180deg,rgba(10,10,11,0),rgba(10,10,11,0.55))",
            display: "flex", alignItems: "flex-end", justifyContent: "center", paddingBottom: 2,
          }}>
            <Camera size={Math.max(9, size * 0.2)} color="#fff" />
          </div>
          <input ref={inputRef} type="file" accept="image/*" onChange={pick} style={{ display: "none" }} />
        </>
      )}
    </div>
  );
}

function tagFor(score) {
  if (score >= 90) return "优秀";
  if (score >= 80) return "良好";
  if (score >= 60) return "一般";
  return "需关注";
}

function ScoreRing({ value, size = 108 }) {
  const r = 46, c = 2 * Math.PI * r, pct = Math.min(100, value) / 100;
  return (
    <svg width={size} height={size} viewBox="0 0 108 108">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#3FC08C" />
          <stop offset="100%" stopColor="#0B7F54" />
        </linearGradient>
      </defs>
      <circle cx="54" cy="54" r={r} fill="none" stroke="rgba(10,10,11,0.06)" strokeWidth="10" />
      <circle cx="54" cy="54" r={r} fill="none" stroke="url(#ringGrad)" strokeWidth="10"
        strokeDasharray={c} strokeDashoffset={c * (1 - pct)} strokeLinecap="round" transform="rotate(-90 54 54)" />
    </svg>
  );
}

function Segmented({ options, value, onChange, width }) {
  const idx = Math.max(0, options.findIndex((o) => o.key === value));
  const n = options.length;
  return (
    <div style={{
      position: "relative", display: "flex", gap: 3, width, padding: 3, borderRadius: 12,
      background: "rgba(10,10,11,0.05)", border: `1px solid ${C.hair}`,
      boxShadow: "inset 0 1px 3px rgba(10,10,11,0.06)",
    }}>
      {/* liquid slider — glides between segments instead of hard-switching */}
      <div style={{
        position: "absolute", top: 3, bottom: 3, left: `calc(3px + ${idx} * ((100% - 6px) / ${n}))`,
        width: `calc((100% - 6px) / ${n})`, borderRadius: 9,
        background: "linear-gradient(160deg,rgba(255,255,255,0.98),rgba(255,255,255,0.72))",
        backdropFilter: "blur(20px) saturate(180%)", WebkitBackdropFilter: "blur(20px) saturate(180%)",
        boxShadow: "0 2px 10px rgba(10,10,11,0.12), inset 0 1px 0 rgba(255,255,255,1)",
        border: "1px solid rgba(255,255,255,0.8)",
        transition: "left .34s cubic-bezier(.32,.72,0,1)",
      }} />
      {options.map((o) => (
        <button key={o.key} onClick={() => onChange(o.key)} style={{
          position: "relative", zIndex: 1, flex: 1, padding: "7px 10px", borderRadius: 9,
          border: "none", cursor: "pointer", whiteSpace: "nowrap", background: "transparent",
          color: value === o.key ? C.text : C.sub,
          fontWeight: value === o.key ? 700 : 500, fontSize: 12.5,
          transition: "color .24s ease",
        }}>{o.label}</button>
      ))}
    </div>
  );
}

/* ============================== AI ============================== */
function getAIReply(input, petName) {
  const t = input;
  if (/舔|肛门|屁股/.test(t)) return `根据${petName}近期的行为数据分析，舔屁股的频率比过去7天增加了60%，可能与肛门腺、软便或轻微肠胃不适有关，建议先观察排便情况，必要时线下检查肛门腺。`;
  if (/活动|运动|懒|不爱动/.test(t)) return `${petName}最近3天活动量持续偏低，较平时下降约32%，天气变化和轻微肠胃不适都可能是原因，建议今晚增加10-15分钟互动玩耍，并留意精神状态。`;
  if (/吃|食欲|饮食|挑食/.test(t)) return `${petName}近期饮食量与平时基本一致，暂无明显异常。如果发现食欲明显下降或饮水量突然变化，建议尽快记录并咨询医生。`;
  if (/睡|失眠|睡眠/.test(t)) return `${petName}这周的睡眠时长比平时略有增加，属于正常波动，通常与活动量下降会同时出现，不用过于担心。`;
  if (/预警|风险/.test(t)) return `这次预警是因为${petName}连续3天活动量下降了32%，风险等级为中风险，主要建议是观察饮食排便、增加陪伴，如持续无改善建议就医。`;
  if (/健康|怎么样|状态/.test(t)) return `${petName}目前健康指数良好，只是这两天活动量略有下降，建议今晚多陪它玩一会儿，明天再观察一下变化趋势。`;
  return `已经在看${petName}最近的行为和健康数据了～可以告诉我具体想了解哪方面，比如活动、饮食、睡眠或者某个异常行为吗？`;
}
const VET_SUGGESTION = "已为你生成就医建议清单：\n✓ 记录近3天排便性状（软便 / 正常 / 腹泻）\n✓ 检查肛门附近是否有红肿或异物\n✓ 观察是否有拖尾巴、频繁回头舔舐的动作\n✓ 若3天内未见改善，建议尽快线下就医\n\n需要我帮你找一下附近的宠物医院吗？";

function AIScreen({ pet, initialMessages, consumeInitial }) {
  const [messages, setMessages] = useState(initialMessages);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, typing]);
  useEffect(() => { if (consumeInitial) consumeInitial(); /* eslint-disable-next-line */ }, []);

  const send = (text) => {
    if (!text.trim()) return;
    setMessages((m) => [...m, { role: "user", text }]);
    setInput("");
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      setMessages((m) => [...m, { role: "assistant", text: getAIReply(text, pet.name), action: /舔|肛门|屁股|预警/.test(text) ? "生成就医建议" : null }]);
    }, 850);
  };
  const handleAction = () => {
    setTyping(true);
    setTimeout(() => { setTyping(false); setMessages((m) => [...m, { role: "assistant", text: VET_SUGGESTION }]); }, 700);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <ScreenHeader title="AI助手" />
      <div style={{ flex: 1, overflowY: "auto", padding: "0 16px" }}>
        {messages.map((m, i) => (
          <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start", marginBottom: 10 }}>
            <div style={{
              maxWidth: "82%", padding: "10px 13px", borderRadius: 17, fontSize: 13, lineHeight: 1.7, whiteSpace: "pre-line",
              background: m.role === "user"
                ? "linear-gradient(150deg,#2A2B2E,#0A0A0B)"
                : "linear-gradient(160deg,rgba(255,255,255,0.78),rgba(255,255,255,0.48))",
              backdropFilter: m.role === "user" ? "none" : "blur(24px) saturate(180%)",
              WebkitBackdropFilter: m.role === "user" ? "none" : "blur(24px) saturate(180%)",
              color: m.role === "user" ? "#fff" : C.text,
              border: m.role === "user" ? "none" : `1px solid ${C.glassBorder}`,
              boxShadow: m.role === "user"
                ? "0 6px 18px rgba(10,10,11,0.26), inset 0 1px 0 rgba(255,255,255,0.16)"
                : "0 6px 22px rgba(10,10,11,0.08), inset 0 1px 0 rgba(255,255,255,0.95)",
              borderBottomRightRadius: m.role === "user" ? 4 : 17,
              borderBottomLeftRadius: m.role === "user" ? 17 : 4,
            }}>
              {m.text}
              {m.action && (
                <div style={{ marginTop: 10 }}>
                  <button onClick={handleAction} style={{ background: "rgba(255,255,255,0.9)", color: C.primaryDeep, border: "none", borderRadius: 20, padding: "7px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>{m.action}</button>
                </div>
              )}
            </div>
          </div>
        ))}
        {typing && (
          <div style={{ display: "flex", justifyContent: "flex-start", marginBottom: 10 }}>
            <div style={{ ...glass(17, { padding: "10px 16px" }), fontSize: 13, color: C.sub }}>对方正在输入…</div>
          </div>
        )}
        <div ref={endRef} />
      </div>
      <div style={{ display: "flex", gap: 8, padding: "10px 16px 14px", alignItems: "center",
        ...frost(0), borderRadius: 0, borderLeft: "none", borderRight: "none", borderBottom: "none" }}>
        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") send(input); }} placeholder="输入你的问题…"
          style={{ flex: 1, border: "1px solid rgba(255,255,255,0.7)", background: "rgba(255,255,255,0.55)",
            backdropFilter: "blur(20px) saturate(180%)", WebkitBackdropFilter: "blur(20px) saturate(180%)",
            borderRadius: 999, padding: "10px 16px", fontSize: 13, outline: "none", color: C.text,
            boxShadow: "inset 0 1px 0 rgba(255,255,255,0.9)" }} />
        <button onClick={() => send(input)} style={{ background: C.primary, border: "none", borderRadius: "50%", width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, boxShadow: "0 4px 14px rgba(10,10,11,0.24)" }}>
          <Send size={16} color="#fff" />
        </button>
      </div>
    </div>
  );
}

/* ============================== HOME CAMERA LINKAGE ==============================

    <div style={{ padding: "0 16px 30px" }}>

        position: "relative", borderRadius: 20, overflow: "hidden", height: 290,
        background: camera.online ? FEED.surface : "rgba(10,10,11,0.04)",
        border: `1px solid ${C.glassBorder}`, boxShadow: C.shadow,
        filter: night ? "grayscale(0.3) sepia(0.35) hue-rotate(72deg) brightness(1.12) contrast(1.08)" : "none",

          <>

            <div style={{ position: "absolute", left: 10, top: 10, display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ display: "flex", alignItems: "center", gap: 5, background: recording ? "rgba(184,74,72,0.9)" : "rgba(255,255,255,0.16)", borderRadius: 20, padding: "4px 9px" }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#fff", opacity: recording ? 1 : 0.5 }} />
                <span style={{ fontSize: 10.5, fontWeight: 700, color: FEED.onFeed }}>{recording ? "REC" : "已暂停"}</span>
              </span>
            </div>

            {faceId && detected && (
              <div style={{ position: "absolute", right: 10, top: 10, fontSize: 10, color: FEED.onFeedSub, background: "rgba(0,0,0,0.32)", padding: "3px 8px", borderRadius: 6 }}>

            )}

            {detected ? (
              <>
                <div style={{ position: "absolute", left: "30%", top: "42%", width: "42%", height: "33%", border: `2px solid ${FEED.accent}`, borderRadius: 6 }}>
                  {["-6px -6px", "-6px calc(100% - 4px)", "calc(100% - 4px) -6px", "calc(100% - 4px) calc(100% - 4px)"].map((pos, i) => (
                    <span key={i} style={{ position: "absolute", left: pos.split(" ")[0], top: pos.split(" ")[1], width: 10, height: 10, borderLeft: i % 2 === 0 ? `2px solid ${FEED.accent}` : "none", borderRight: i % 2 === 1 ? `2px solid ${FEED.accent}` : "none", borderTop: i < 2 ? `2px solid ${FEED.accent}` : "none", borderBottom: i >= 2 ? `2px solid ${FEED.accent}` : "none" }} />

                </div>
                <div style={{ position: "absolute", left: "30%", top: "calc(42% - 28px)", background: FEED.accent, color: "#04291C", fontSize: 11, fontWeight: 800, padding: "4px 10px", borderRadius: 7 }}>

              </>

      {/* controls — ordinary light glass, identical to the device page */}

            {recording ? <Pause size={13} color={C.primaryDeep} /> : <Play size={13} color={C.primaryDeep} />}
          </button>
          <div style={{ flex: 1, fontSize: 12.5, color: C.text, fontWeight: 600 }}>{recording ? "正在录制中" : "录制已暂停"}</div>
          <Badge tone={recording ? "danger" : "dark"}>{recording ? "REC" : "暂停"}</Badge>

      {camera.online && detected && alertOn && (
        <button onClick={() => setShowAnomaly(true)} disabled={showAnomaly} style={{
          width: "100%", marginTop: 10, background: "transparent", border: `1px dashed rgba(10,10,11,0.18)`,
          borderRadius: 14, padding: 11, color: C.sub, fontSize: 11.5, cursor: showAnomaly ? "default" : "pointer",
        }}>

      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12 }}>
        {[
          { icon: Smile, label: "面部识别", on: faceId, set: setFaceId },
          { icon: Bone, label: "骨骼追踪", on: skeleton, set: setSkeleton },
          { icon: Moon, label: "夜视模式", on: night, set: setNight },
          { icon: AlertTriangle, label: "异常警报", on: alertOn, set: setAlertOn },
        ].map((it) => (
          <div key={it.label} style={{ ...glass(14, { padding: "10px 12px" }), display: "flex", alignItems: "center", gap: 8 }}>
            <it.icon size={15} color={it.on ? C.primaryDeep : C.subtle} />

            <Toggle on={it.on} onClick={() => it.set(!it.on)} />
          </div>
        ))}
      </div>
    </div>
  );
}

          }}>
            <it.icon size={19} color={active ? C.primaryDeep : C.subtle} />
            <span style={{ fontSize: 9.5, color: active ? C.primaryDeep : C.subtle, fontWeight: active ? 700 : 500 }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ============================== APP ============================== */
function App() {
  const [pets, setPets] = useState([makePet("momo")]);
  const [activeId, setActiveId] = useState(pets[0].id);
  const activePet = pets.find((p) => p.id === activeId) || pets[0];

  const [tab, setTab] = useState("home");
  const [overlay, setOverlay] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [toastText, setToastText] = useState("");
  const [aiSeed, setAiSeed] = useState(null);
  const [unread, setUnread] = useState(3);
  const [cameraId, setCameraId] = useState("living");
  const [scrolled, setScrolled] = useState(0);

  const toast = (t) => { setToastText(t); setTimeout(() => setToastText(""), 1600); };

  const baseAIMessages = (petName) => [
    { role: "user", text: `为什么我家猫最近一直舔屁股？` },
    { role: "assistant", text: `根据${petName}近期的行为数据分析，舔屁股的频率比过去7天增加了60%，可能的原因包括：\n1. 肛门腺问题\n2. 肠胃不适（软便）\n3. 寄生虫感染\n\n结合${petName}的排便记录（近3天有软便情况），建议：\n• 观察排便情况\n• 检查肛门腺是否需要清理\n• 必要时咨询宠物医生`, action: "生成就医建议" },
  ];

  const consultFromAlert = () => {
    setAiSeed([
      ...baseAIMessages(activePet.name),
      { role: "user", text: "帮我看看这次的活动量下降预警" },
      { role: "assistant", text: `这次预警是因为${activePet.name}连续3天活动量下降了32%，属于中风险。结合近期偶有软便，可能与肠胃不适、季节变化或情绪压力有关。建议今晚多陪伴互动，并持续观察饮食与排便，若3天内无改善建议就医。`, action: "生成就医建议" },
    ]);
    setOverlay(null); setTab("ai");
  };

  const consultFromCamera = () => {
    setAiSeed([
      ...baseAIMessages(activePet.name),
      { role: "user", text: "客厅摄像头刚才检测到异常行为，帮我看看" },
      { role: "assistant", text: `摄像头画面显示${activePet.name}最近的舔舐动作比平时更频繁，结合行为数据分析，这与近期的活动量下降、软便情况是相互印证的，建议按照上面的建议先观察1-2天，如果没有缓解就尽快就医。`, action: "生成就医建议" },
    ]);
    setOverlay(null); setTab("ai");
  };

  const openOverlay = (name) => setOverlay(name);
  const openSheet = (name) => setSheet(name);
  const closeSheet = () => setSheet(null);

  const switchPet = (id) => { setActiveId(id); toast("已切换宠物"); };
  const addPet = (preset) => {
    const np = makePet(preset);
    setPets((p) => [...p, np]);
    setActiveId(np.id);
    setSheet(null);
    toast(`已添加 ${np.name} 到你的宠物列表`);
  };
  const saveProfile = (changes) => setPets((p) => p.map((pp) => (pp.id === activeId ? { ...pp, ...changes } : pp)));
  const setPhoto = (dataUrl) => { saveProfile({ photo: dataUrl }); toast("头像已更新"); };

  let content;
  if (overlay === "alert") content = <AlertDetailScreen pet={activePet} onBack={() => setOverlay(null)} onConsultAI={consultFromAlert} />;
  else if (overlay === "personality") content = <PersonalityScreen pet={activePet} onBack={() => setOverlay(null)} />;
  else if (overlay === "petProfile") content = <PetProfileScreen pet={activePet} onBack={() => setOverlay(null)} onSave={saveProfile} toast={toast} onPhoto={setPhoto} />;
  else if (overlay === "healthRecords") content = <HealthRecordsScreen pet={activePet} onBack={() => setOverlay(null)} toast={toast} />;
  else if (overlay === "cameraList") content = <CameraListScreen onBack={() => setOverlay(null)} onOpenCamera={(id) => { setCameraId(id); setOverlay("cameraMonitor"); }} toast={toast} />;
  else if (overlay === "cameraMonitor") content = <CameraMonitorScreen pet={activePet} cameraId={cameraId} setCameraId={setCameraId} onBack={() => setOverlay("cameraList")} onGoAI={consultFromCamera} toast={toast} />;
  else if (tab === "home") content = <HomeScreen pet={activePet} onPhoto={setPhoto} goAlert={() => setOverlay("alert")} goCamera={() => { setCameraId("living"); setOverlay("cameraMonitor"); }} toast={toast} openSheet={(s) => { if (s === "notifications") setUnread(0); openSheet(s); }} unread={unread} />;
  else if (tab === "health") content = <HealthScreen pet={activePet} goAlert={() => setOverlay("alert")} />;
  else if (tab === "ai") content = <AIScreen pet={activePet} initialMessages={aiSeed || baseAIMessages(activePet.name)} consumeInitial={() => setAiSeed(null)} />;
  else if (tab === "device") content = <DeviceScreen toast={toast} openSheet={openSheet} openOverlay={openOverlay} />;
  else if (tab === "profile") content = <ProfileScreen pet={activePet} openSheet={openSheet} openOverlay={openOverlay} toast={toast} />;

  return (
    <div style={{ width: "100%", minHeight: "100vh", background: "#DCDDE1", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Poppins','PingFang SC','Helvetica Neue',Arial,sans-serif", padding: "24px 0" }}>
      <div style={{ width: 390, height: 800, borderRadius: 44, overflow: "hidden", position: "relative", boxShadow: "0 24px 70px rgba(10,10,11,0.25)", border: "8px solid #0A0A0B", display: "flex", flexDirection: "column", ...AURORA_BG }}>
        <StatusBar />
        {/* scroll-reactive glass: the bar materialises as content slides under it */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 46, zIndex: 300, pointerEvents: "none",
          opacity: Math.min(1, scrolled / 40),
          background: "rgba(246,246,248,0.72)",
          backdropFilter: "blur(30px) saturate(190%)", WebkitBackdropFilter: "blur(30px) saturate(190%)",
          borderBottom: "1px solid rgba(255,255,255,0.5)",
          maskImage: "linear-gradient(180deg,#000 62%,transparent)",
          WebkitMaskImage: "linear-gradient(180deg,#000 62%,transparent)",
          transition: "opacity .18s ease",
        }} />
        <div
          key={overlay || tab}
          onScroll={(e) => setScrolled(e.currentTarget.scrollTop)}
          style={{ flex: 1, overflowY: "auto", position: "relative", WebkitOverflowScrolling: "touch" }}
        >{content}</div>
        {!overlay && <BottomNav tab={tab} setTab={setTab} />}
        <Toast text={toastText} />
        {sheet === "notifications" && <NotificationsSheet onClose={closeSheet} />}
        {sheet === "petSwitcher" && <PetSwitcherSheet pets={pets} activeId={activeId} onSwitch={switchPet} onAdd={addPet} onClose={closeSheet} />}
        {sheet === "family" && <FamilySheet onClose={closeSheet} toast={toast} />}
        {sheet === "reminders" && <RemindersSheet onClose={closeSheet} />}
        {sheet === "permissions" && <PermissionsSheet onClose={closeSheet} />}
        {sheet === "help" && <HelpSheet onClose={closeSheet} />}
        {sheet === "deviceSettings" && <DeviceSettingsSheet onClose={closeSheet} />}
        {sheet === "deviceHelp" && <DeviceHelpSheet onClose={closeSheet} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
