<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星澜智能合同审查平台</title>
<style>
  :root{
    --top:#1f2632; --top2:#2a3342;
    --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#e8f1ff; --brand-line:#cfe0ff;
    --bg:#f4f6fa; --card:#ffffff; --line:#e9edf3; --line2:#eef1f6;
    --ink:#1f2937; --sub:#6b7280; --faint:#9aa3b2;
    --inp:#d9dde5; --inpbg:#f7f8fa;
    --g:#22c55e; --b:#3b82f6; --o:#f59e0b; --r:#ef4444;
    --red:#dc2626; --red-bg:#fef2f2; --red-line:#fbd5d5;
    --amb:#d97706; --amb-bg:#fffbeb; --amb-line:#fde9c8;
    --grn:#059669; --grn-bg:#ecfdf5; --grn-line:#c5ecdc;
    /* 以下为新增的非颜色 token，仅用于统一圆角/阴影/过渡节奏，不涉及任何配色调整 */
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --sh-1:0 1px 2px rgba(20,30,55,.04);
    --sh-2:0 6px 20px rgba(20,30,55,.07);
    --sh-3:0 20px 52px rgba(15,23,42,.16);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .app{display:flex;flex-direction:column;height:100vh;min-height:680px}
  /* 全局滚动条：更纤细、更克制 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#d7dce4;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#c3cad6;background-clip:padding-box}
  /* top bar */
  .topbar{height:56px;background:linear-gradient(180deg,var(--top),var(--top2));color:#fff;display:flex;align-items:center;padding:0 22px;flex:none;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 4px 16px rgba(15,23,42,.12);position:relative;z-index:12}
  .brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:600;letter-spacing:.2px}
  .brand .dot{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c7d2e6);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
  .env{margin-left:14px;font-size:11px;color:#9fb4d8;border:1px solid #3a4a63;padding:2px 9px;border-radius:999px;letter-spacing:.3px}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:6px;color:#cdd3de;font-size:13px}
  .top-r .bell{font-size:16px;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;transition:background .15s var(--ease)}
  .top-r .bell:hover{background:rgba(255,255,255,.08)}
  .top-r .bell::after{content:"";position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--r);box-shadow:0 0 0 2px var(--top2)}
  .top-r .bell.no-unread::after{display:none}
  .top-r .user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 10px 5px 6px;border-radius:9px;transition:background .15s var(--ease);margin-left:8px}
  .top-r .user:hover{background:rgba(255,255,255,.08)}
  .top-r .av{width:26px;height:26px;border-radius:50%;background:#cbd3e0;box-shadow:0 0 0 2px rgba(255,255,255,.1)}
  .notify-panel{position:fixed;z-index:45;top:66px;right:96px;width:360px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);overflow:hidden;animation:popIn .16s var(--ease)}
  .notify-head{height:50px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.notify-head b{font-size:15px}.notify-head button{margin-left:auto;border:0;background:none;color:var(--brand);font:inherit;font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px;transition:background .15s}.notify-head button:hover{background:var(--brand-soft)}
  .notify-item{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .12s}.notify-item:hover{background:#f8faff}.notify-item.read{opacity:.65}.notify-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:5px;flex:none}.notify-item.read .notify-dot{background:#cbd5e1}.notify-copy{min-width:0}.notify-copy b{display:block;font-size:12.5px;margin-bottom:4px}.notify-copy p{margin:0;color:var(--sub);font-size:11.5px;line-height:1.55}.notify-copy time{display:block;color:var(--faint);font-size:10.5px;margin-top:5px}.notify-empty{padding:34px 16px;text-align:center;color:var(--faint);font-size:12px}
  .user-menu{position:fixed;z-index:45;top:66px;right:18px;width:250px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);overflow:hidden;animation:popIn .16s var(--ease)}.user-card{padding:16px;display:flex;gap:11px;border-bottom:1px solid var(--line)}.user-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;flex:none}.user-card b{display:block;font-size:13.5px;margin:1px 0 3px}.user-card span{display:block;color:var(--sub);font-size:11.5px}.user-menu-item{height:42px;padding:0 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;transition:background .12s}.user-menu-item:hover{background:#f7f9fc}.user-menu-item.danger{color:var(--red);border-top:1px solid var(--line2)}.profile-drawer{width:480px}.profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-size:20px;font-weight:700;margin:18px auto 4px}.profile-role{text-align:center;color:var(--sub);font-size:12px;margin-bottom:8px}
  @keyframes popIn{0%{opacity:0;transform:translateY(-6px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
  /* body */
  .main{flex:1;display:flex;min-height:0}
  .side{width:210px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
  .nav{padding:14px 8px;flex:1}
  .nav a{display:flex;align-items:center;gap:11px;height:46px;padding:0 16px;margin-bottom:2px;color:#4b5563;border-radius:9px;
    text-decoration:none;font-size:14.5px;cursor:pointer;border-left:3px solid transparent;transition:background .15s var(--ease),color .15s var(--ease)}
  .nav a .ic{width:18px;text-align:center;font-size:15px;opacity:.75}
  .nav a:hover{background:#f6f8fc}
  .nav a.active{background:var(--brand-soft);color:var(--brand);border-left-color:var(--brand);font-weight:600}
  .nav a.active .ic{opacity:1}
  .collapse{height:48px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 24px;color:var(--faint);cursor:pointer;transition:background .15s}
  .collapse:hover{background:#f7f9fc}
  .content{flex:1;overflow:auto;padding:22px 26px}
  /* page chrome */
  .ptitle{font-size:20px;font-weight:700;margin:2px 0 16px;letter-spacing:-.2px}
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .tabs .tb{padding:0 2px 12px;color:var(--sub);font-size:14.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
  .tabs .tb:hover{color:var(--ink)}
  .tabs .tb.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1)}
  /* filters */
  .filters{padding:22px 22px 8px;display:flex;flex-wrap:wrap;gap:16px 26px;align-items:center}
  .fitem{display:flex;align-items:center;gap:10px}
  .fitem label{color:#4b5563;font-size:13.5px;white-space:nowrap}
  .inp,.sel{height:36px;border:1px solid var(--inp);border-radius:var(--r-sm);padding:0 11px;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
  .inp:hover,.realsel:hover{border-color:#c3cad6}
  .inp:focus,.realsel:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .sel{background:var(--inpbg);min-width:210px;display:flex;align-items:center;justify-content:space-between;color:var(--sub);cursor:pointer}
  .sel::after{content:"⌄";margin-left:10px;color:var(--faint);font-size:15px;transform:translateY(-3px)}
  .realsel{height:36px;border:1px solid var(--inp);border-radius:var(--r-sm);padding:0 11px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--inpbg);outline:none;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .inp::placeholder{color:#aeb6c2}
  .w-amt{width:248px}
  .filters .realsel{min-width:210px}.amount-range,.date-filter{display:flex;align-items:center;gap:7px}.amount-range .inp{width:112px}.date-filter .inp{width:140px;background:var(--inpbg)}.filter-sep{color:var(--faint)}.filter-empty{text-align:center;color:var(--faint);padding:38px!important}
  .daterange{display:flex;align-items:center;gap:8px;border:1px solid var(--inp);border-radius:var(--r-sm);background:var(--inpbg);height:36px;padding:0 11px;color:var(--faint);font-size:13.5px;min-width:248px}
  .daterange .sep{color:#c2c8d2}
  .fbtns{margin-left:auto;display:flex;flex-direction:column;gap:10px}
  .btn{height:36px;border:1px solid var(--inp);background:#fff;color:var(--ink);border-radius:var(--r-sm);
    padding:0 16px;font:inherit;font-size:13.5px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:border-color .15s,background .15s,box-shadow .15s,transform .05s}
  .btn:hover{border-color:#bcc4d0;background:#fafbfd}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 1px 2px rgba(37,99,235,.15),0 4px 10px rgba(37,99,235,.14)}
  .btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);box-shadow:0 2px 6px rgba(37,99,235,.2),0 6px 16px rgba(37,99,235,.18)}
  .btn.sm{height:30px;padding:0 12px;font-size:12.5px}
  .toolrow{padding:14px 22px 18px}
  /* table */
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:12.5px;color:var(--sub);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbfd;letter-spacing:.2px}
  tbody td{padding:15px 14px;border-bottom:1px solid var(--line2);font-size:13.5px;color:var(--ink)}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:#fafbff}
  .code{color:var(--sub)}
  .code .ico{color:#b9c1cd;margin-left:5px;cursor:pointer}
  .money{font-weight:600;white-space:nowrap}.money-source{display:block;margin-top:3px;font-size:10.5px;color:var(--faint);font-weight:400;white-space:nowrap}.money-source.pending{color:var(--amb)}
  .nm{font-weight:600}
  .st{display:inline-flex;align-items:center;gap:7px}
  .st .d{width:7px;height:7px;border-radius:50%}
  .lnk{color:var(--brand);cursor:pointer;font-weight:500}
  .lnk:hover{text-decoration:underline}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:18px 14px 6px;color:var(--sub);font-size:13px}
  .pg{min-width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer;background:#fff;transition:all .12s}
  .pg:hover{border-color:#c3cad6}
  .pg.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pg.ghost{border:0;background:transparent}
  .total{margin-right:10px}
  .pp{margin-left:10px;border:1px solid var(--line);border-radius:var(--r-sm);height:30px;display:flex;align-items:center;padding:0 10px;color:var(--sub)}
  /* pills */
  .pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;display:inline-block;white-space:nowrap;letter-spacing:.1px}
  .p-red{color:var(--red);background:var(--red-bg);border:1px solid var(--red-line)}
  .p-amb{color:var(--amb);background:var(--amb-bg);border:1px solid var(--amb-line)}
  .p-grn{color:var(--grn);background:var(--grn-bg);border:1px solid var(--grn-line)}
  .p-blue{color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-line)}
  .p-grey{color:var(--sub);background:#f1f3f7;border:1px solid var(--line)}
  /* generic page header w/ back */
  .pghead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .crumb{color:var(--sub);font-size:13px}
  .crumb b{color:var(--ink)}
  /* workbench */
  .wb{display:grid;grid-template-columns:210px 1fr 330px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff;min-height:540px;box-shadow:var(--sh-1)}
  .wbnav{border-right:1px solid var(--line2);padding:14px 8px;background:#fbfcfe;overflow:auto;max-height:600px}
  .wbnav .t{font-size:11px;color:var(--faint);font-weight:700;padding:4px 10px 8px;letter-spacing:.4px}
  .wbnav .it{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--sub);cursor:pointer;transition:background .12s}
  .wbnav .it:hover{background:#eef2f8}
  .wbnav .it.cur{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
  .wbnav .it .d{width:7px;height:7px;border-radius:50%;flex:none}
  .wbdoc{padding:18px 22px;overflow:auto;max-height:600px;border-right:1px solid var(--line2)}
  .wbdoc h4{margin:0 0 4px;font-size:13px;color:var(--brand-d)}
  .wb-section{border-radius:9px;padding:5px;margin:0 -5px 7px;cursor:pointer;transition:.15s var(--ease)}.wb-section.selected{background:#f4f8ff;box-shadow:0 0 0 1px #c8daf8}.wb-section.selected h4:after{content:"当前条款";font-size:10px;font-weight:500;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:2px 7px;margin-left:8px}.wb-section .clause{margin-bottom:0}
  .wb-section.adopted{box-shadow:inset 3px 0 0 var(--grn)}.adopt-preview{margin-top:7px;padding:9px 11px;background:var(--grn-bg);border:1px solid var(--grn-line);border-radius:7px;color:#176b4a;font-size:11.5px;line-height:1.65}.adopt-preview b{color:var(--grn)}
  .wb-section.modified{box-shadow:inset 3px 0 0 var(--brand)}.adopt-preview.modified{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}.adopt-preview.modified b{color:var(--brand)}
  .wb-section.ignored{box-shadow:inset 3px 0 0 var(--amb)}.adopt-preview.ignored{background:var(--amb-bg);border-color:var(--amb-line);color:#8a5707}.adopt-preview.ignored b{color:var(--amb)}
  .clause{padding:12px 14px;border-radius:9px;margin-bottom:12px;border:1px solid var(--line);font-size:13px;line-height:1.75}
  .clause.r{background:var(--red-bg);border-color:var(--red-line)}
  .clause.a{background:var(--amb-bg);border-color:var(--amb-line)}
  .clause .tg{float:right;margin-left:10px}
  .mk{border-bottom:2px solid;padding-bottom:1px}
  .mk.r{border-color:var(--red)}.mk.a{border-color:var(--amb)}
  .wbside{overflow:auto;max-height:600px}
  .rhead{padding:14px 16px;border-bottom:1px solid var(--line2)}
  .rhead .lv{display:flex;align-items:center;gap:10px}.rhead .lv b{font-size:15px}
  .gauge{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.65}
  .risk{padding:13px 16px;border-bottom:1px solid var(--line2)}
  .risk-context{padding:9px 16px;background:#f7f9fc;border-bottom:1px solid var(--line2);color:var(--sub);font-size:11.5px}.risk-context b{color:var(--brand)}
  .risk-result{margin-top:9px;padding:9px 10px;background:var(--grn-bg);border:1px solid var(--grn-line);border-radius:7px;font-size:11.5px;line-height:1.65;color:#176b4a}.risk-result .meta{color:var(--faint);font-size:10.5px;margin-top:4px}.btn.undo{color:var(--sub);background:#fff}
  .risk-result.modified{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}.modify-original{padding:9px 10px;background:#f7f8fa;border-radius:6px;color:var(--sub);font-size:12px;line-height:1.65}.modify-modal .form-ta{min-height:96px}.modify-modal .field{margin-bottom:14px}
  .risk-result.ignored{background:var(--amb-bg);border-color:var(--amb-line);color:#8a5707}.ignore-warning{padding:11px 12px;background:var(--red-bg);border:1px solid var(--red-line);border-radius:7px;color:var(--red);font-size:12px;line-height:1.65;margin-bottom:14px}
  .review-progress{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--sub);font-size:11.5px}.review-progress-track{width:86px;height:6px;background:#e5e9f0;border-radius:99px;overflow:hidden}.review-progress-bar{height:100%;background:var(--brand);border-radius:99px;transition:width .3s var(--ease)}.review-progress.done{color:var(--grn)}.review-progress.done .review-progress-bar{background:var(--grn)}
  .draft-modal{width:860px;max-width:95vw;height:min(820px,92vh);background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-3);display:flex;flex-direction:column;overflow:hidden;animation:popIn .18s var(--ease)}.draft-body{padding:22px 26px;overflow:auto}.draft-summary{padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:#f7f9fc;margin-bottom:16px}.draft-summary h3{margin:0 0 6px;font-size:16px}.draft-summary p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.65}.draft-issue{border:1px solid var(--line);border-radius:8px;padding:13px 14px;margin-bottom:10px}.draft-issue-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}.draft-issue-head b{font-size:13px}.draft-issue .result{padding:8px 10px;background:#f7f8fa;border-radius:6px;color:var(--sub);font-size:12px;line-height:1.65}.draft-issue .result strong{color:var(--ink)}
  .risk .tp{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .risk .tt{font-weight:600;font-size:12.5px}
  .basis{font-size:11.5px;color:var(--sub);background:#f6f8fc;border-radius:7px;padding:7px 9px;margin:6px 0}
  .sugg{font-size:11.5px}.sugg b{color:var(--grn)}
  .acts{display:flex;gap:6px;margin-top:9px}
  /* opinion sheet */
  .sheet{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 32px;box-shadow:var(--sh-2)}
  .sheet h3{margin:0 0 3px;font-size:18px;font-weight:700}
  .sheet .by{color:var(--faint);font-size:12px;margin-bottom:16px}
  .verdict{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;background:var(--red-bg);border:1px solid var(--red-line);margin-bottom:16px}
  .verdict b{font-size:15px;color:var(--red)}
  .oprow{padding:12px 0;border-top:1px solid var(--line2)}
  .oprow .h{display:flex;align-items:center;gap:9px;margin-bottom:4px}.oprow .h b{font-size:13px}
  .oprow .bd{font-size:12.5px;color:var(--sub);line-height:1.7}.oprow .bd em{color:var(--grn);font-style:normal;font-weight:600}
  .endbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .opinion-top{display:flex;align-items:flex-start;margin-bottom:16px}.opinion-top h3{margin:0 0 4px;font-size:18px;font-weight:700}.opinion-top .meta{color:var(--faint);font-size:12px}.opinion-top .pill{margin-left:auto}
  .verdict.medium{background:var(--amb-bg);border-color:var(--amb-line)}.verdict.medium b{color:var(--amb)}.verdict.low{background:var(--grn-bg);border-color:var(--grn-line)}.verdict.low b{color:var(--grn)}

  .rem-time{display:flex;gap:10px;padding:8px 0;font-size:12px}.rem-time .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:5px;flex:none}.rem-time span{color:var(--faint);width:88px;flex:none}.rem-choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}.rem-choice label{border:1px solid var(--inp);border-radius:7px;padding:10px 12px;font-size:12.5px;cursor:pointer;transition:all .12s}.rem-choice label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}.rem-choice input{accent-color:var(--brand);margin-right:6px}

</style>

<body>

<script>
const DATA = [
  {code:"50225024-7129",name:"云策数据分析平台订购单",type:"SaaS订单合同",by:"李明",time:"2026-06-20 13:50:15",st:"待复核",dot:"var(--b)",risk:"高",amount:216000,currency:"CNY",amountSource:"AI识别",amountConfirmed:true},
  {code:"51525367-5027",name:"恒芯电子芯片采购合同",type:"采购合同",by:"李明",time:"2026-06-19 13:20:10",st:"已审查",dot:"var(--b)",risk:"低",amount:480000,currency:"CNY",amountSource:"采购系统",amountConfirmed:true},
  {code:"37700763-4766",name:"恒芯电子框架续约件",type:"框架采购",by:"李明",time:"2026-06-19 09:21:23",st:"待终审",dot:"var(--o)",risk:"中",amount:1200000,currency:"CNY",amountSource:"采购系统",amountConfirmed:true},
  {code:"79023141-6582",name:"营销推广服务合同",type:"业务合同",by:"张三",time:"2026-06-18 22:51:34",st:"讨论中",dot:"var(--o)",risk:"中",amount:300000,currency:"CNY",amountSource:"用户填写",amountConfirmed:true},
  {code:"66322694-9281",name:"办公SaaS年度续订单",type:"业务合同",by:"张三",time:"2026-06-18 17:21:10",st:"待审查",dot:"var(--o)",risk:"—",amount:96000,currency:"CNY",amountSource:"AI识别",amountConfirmed:false},
  {code:"94433958-2553",name:"某供应商自有模板合同",type:"SaaS订单合同",by:"张三",time:"2026-06-17 02:35:54",st:"已驳回",dot:"var(--r)",risk:"高",amount:180000,currency:"CNY",amountSource:"AI识别",amountConfirmed:false},
  {code:"22117845-9034",name:"IT运维服务合同",type:"服务合同",by:"王芳",time:"2026-06-16 10:02:11",st:"已完成",dot:"var(--g)",risk:"低",amount:240000,currency:"CNY",amountSource:"财务系统",amountConfirmed:true},
];

/* ---------- 合同审查 ---------- */
const UPLOADS = [
  {file:"云策数据_订购单.docx", fmt:"DOCX", spec:"文本型 · 8 页", ocr:"解析完成", os:"p-grn", by:"张三", time:"2026-06-20 13:48", note:"识别为 SaaS 订购单"},
  {file:"营销推广服务合同_盖章.pdf", fmt:"PDF", spec:"图片型 · 6 页", ocr:"OCR 72%", os:"p-amb", by:"张三", time:"2026-06-20 13:40", note:"第 4 页 2 处低置信待确认",ocrItems:[{page:4,confidence:68,label:"验收期限",recognized:"甲方应在活动执行完成后 3 个工作日内完成验攵。",corrected:"甲方应在活动执行完成后 3 个工作日内完成验收。"},{page:4,confidence:74,label:"违约金比例",recognized:"乙方逾期交付的,每日按合同总价的 0.O5% 支付违约金。",corrected:"乙方逾期交付的,每日按合同总价的 0.05% 支付违约金。"}]},
  {file:"恒芯框架续约件.pdf", fmt:"PDF", spec:"文本型 · 22 页", ocr:"解析完成", os:"p-grn", by:"李明", time:"2026-06-19 09:18", note:"检出与去年版差异"},
  {file:"恒芯芯片采购合同.docx", fmt:"DOCX", spec:"文本型 · 5 页", ocr:"解析完成", os:"p-grn", by:"李明", time:"2026-06-19 13:15", note:"—"},
  {file:"某供应商自有模板.pdf", fmt:"PDF", spec:"图片型 · 11 页", ocr:"OCR 失败", os:"p-red", by:"张三", time:"2026-06-17 02:30", note:"扫描质量低,建议重扫"},
];
function ftBadge(fmt){
  const c = fmt==="PDF" ? "#d64545" : "#2b6cb0";
  return `<span style="display:inline-block;font-size:10px;font-weight:700;color:#fff;background:${c};border-radius:4px;padding:2px 6px;margin-right:8px">${fmt}</span>`;
}
const CONTRACT_FILTERS={status:"",min:"",max:"",type:"",start:"",end:""};
function contractFilterOptions(values,current){ return `<option value="">全部</option>${values.map(v=>`<option value="${v}" ${current===v?'selected':''}>${v}</option>`).join('')}`; }
function formatContractAmount(d){
  if(!d.amount) return `<span class="money" style="color:var(--faint)">待识别</span><span class="money-source pending">暂无确认金额</span>`;
  const symbols={CNY:"¥",USD:"US$",EUR:"€"};
  const source=`${d.amountSource||'未知来源'} · ${d.amountConfirmed?'已确认':'待确认'}`;
  return `<span class="money">${symbols[d.currency]||d.currency||'¥'}${Number(d.amount).toLocaleString('zh-CN')}</span><span class="money-source ${d.amountConfirmed?'':'pending'}">${source}</span>`;
}
function filteredContracts(){
  return DATA.filter(d=>{
    const amount=Number(d.amount||0);
    const hasAmount=amount>0;
    const date=d.time.slice(0,10);
    return (!CONTRACT_FILTERS.status||d.st===CONTRACT_FILTERS.status)
      && (!CONTRACT_FILTERS.type||d.type===CONTRACT_FILTERS.type)
      && ((CONTRACT_FILTERS.min===""&&CONTRACT_FILTERS.max==="")||(hasAmount&&(CONTRACT_FILTERS.min===""||amount>=Number(CONTRACT_FILTERS.min))&&(CONTRACT_FILTERS.max===""||amount<=Number(CONTRACT_FILTERS.max))))
      && (!CONTRACT_FILTERS.start||date>=CONTRACT_FILTERS.start)
      && (!CONTRACT_FILTERS.end||date<=CONTRACT_FILTERS.end);
  });
}
function allContractsCard(){
  const result=filteredContracts();
  const rows = result.map(d=>`
    <tr>
      <td class="code">${d.code}<span class="ico">⧉</span></td>
      <td class="nm">${d.name}</td>
      <td>${d.type}</td>
      <td>${formatContractAmount(d)}</td>
      <td>${d.by}</td>
      <td>${d.time}</td>
      <td><span class="st"><span class="d" style="background:${d.dot}"></span>${d.st}</span></td>
      <td><span class="lnk" onclick="openDetail('${d.code}')">详情</span></td>
    </tr>`).join("") || `<tr><td colspan="8" class="filter-empty">没有符合当前条件的合同</td></tr>`;
  const statuses=[...new Set(DATA.map(d=>d.st))];
  const types=[...new Set(DATA.map(d=>d.type))];
  return `
    <div class="card">
      <div class="filters">
        <div class="fitem"><label>合同状态</label><select class="realsel" id="filterStatus">${contractFilterOptions(statuses,CONTRACT_FILTERS.status)}</select></div>
        <div class="fitem"><label>合同金额</label><div class="amount-range"><input class="inp" id="filterMin" type="number" min="0" value="${CONTRACT_FILTERS.min}" placeholder="最低金额"><span class="filter-sep">—</span><input class="inp" id="filterMax" type="number" min="0" value="${CONTRACT_FILTERS.max}" placeholder="最高金额"></div></div>
        <div class="fitem"><label>合同类型</label><select class="realsel" id="filterType">${contractFilterOptions(types,CONTRACT_FILTERS.type)}</select></div>
        <div class="fitem"><label>提交时间</label><div class="date-filter"><input class="inp" id="filterStart" type="date" value="${CONTRACT_FILTERS.start}"><span class="filter-sep">—</span><input class="inp" id="filterEnd" type="date" value="${CONTRACT_FILTERS.end}"></div></div>
        <div class="fbtns"><button class="btn primary" onclick="applyContractFilters()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>查询</button><button class="btn" onclick="resetContractFilters()">↻ 重置</button></div>
      </div>
      <div class="toolrow"><button class="btn primary" onclick="openUpload()">＋ 上传合同</button></div>
      <table>
        <thead><tr><th>内部编号</th><th>合同名称</th><th>合同类型</th><th>合同金额</th><th>提交人</th><th>提交时间 ⇅</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="pager">
        <span class="total">共 ${result.length} 条</span>
        <span class="pg ghost">‹</span>
        <span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">4</span><span class="pg">5</span>
        <span class="pg ghost">…</span><span class="pg">10</span>
        <span class="pg ghost">›</span>
        <span class="pp">10 条/页 ⌄</span>
      </div>
    </div>`;
}
function applyContractFilters(){
  const next={status:document.getElementById('filterStatus').value,min:document.getElementById('filterMin').value,max:document.getElementById('filterMax').value,type:document.getElementById('filterType').value,start:document.getElementById('filterStart').value,end:document.getElementById('filterEnd').value};
  if(next.min!==""&&next.max!==""&&Number(next.min)>Number(next.max)){ templateEditorToast('最低金额不能大于最高金额'); return; }
  if(next.start&&next.end&&next.start>next.end){ templateEditorToast('开始日期不能晚于结束日期'); return; }
  Object.assign(CONTRACT_FILTERS,next);
  render('review','all');
}
function resetContractFilters(){ Object.assign(CONTRACT_FILTERS,{status:"",min:"",max:"",type:"",start:"",end:""}); render('review','all'); }
function uploadRecordsCard(){
  const rows = UPLOADS.map((u,i)=>{
    const act = u.draft ? `<span class="lnk" onclick="openUpload()">继续填写</span>` : u.os==="p-red" ? `<span class="lnk" onclick="openReparse(${i})">重新解析</span>` :
      u.os==="p-amb" ? `<span class="lnk" onclick="openOcrConfirm(${i})">确认 OCR</span>` : `<span class="lnk" onclick="openDetail('50225024-7129')">进入审查</span>`;
    return `<tr>
      <td class="nm">${ftBadge(u.fmt)}${u.file}</td>
      <td>${u.spec}</td>
      <td><span class="pill ${u.os}">${u.ocr}</span></td>
      <td style="color:var(--sub)">${u.note}</td>
      <td>${u.by}</td>
      <td>${u.time}</td>
      <td>${act}</td>
    </tr>`;
  }).join("");
  return `
    <div class="card">
      <div class="toolrow" style="display:flex;align-items:center">
        <span style="color:var(--sub);font-size:13px">近 7 日上传 · 含解析与 OCR 状态(低置信不静默采纳,需人工确认)</span>
        <button class="btn primary" style="margin-left:auto" onclick="openUpload()">＋ 上传合同</button>
      </div>
      <table>
        <thead><tr><th>文件名</th><th>规格</th><th>解析 / OCR</th><th>备注</th><th>上传人</th><th>上传时间</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
let OCR_ACTIVE_INDEX=-1;
function openOcrConfirm(index){
  const u=UPLOADS[index];
  if(!u?.ocrItems?.length) return;
  OCR_ACTIVE_INDEX=index;
  const mask=document.createElement('div');
  mask.id='ocrConfirmModal'; mask.className='tpl-mask edit-preview';
  mask.onclick=e=>{ if(e.target===mask) closeOcrConfirm(); };
  const highlights=u.ocrItems.map((x,i)=>`<p><b>${x.label}:</b><span class="ocr-low" id="ocrHighlight${i}">${editSafe(x.recognized)}</span></p>`).join('');
  const items=u.ocrItems.map((x,i)=>`<div class="ocr-item" id="ocrItem${i}" onclick="focusOcrItem(${i})"><div class="ocr-item-head"><b>${x.label} · 第 ${x.page} 页</b><span>置信度 ${x.confidence}%</span></div><div class="field"><label>识别结果(可修正)</label><textarea class="form-ta" id="ocrText${i}" onclick="event.stopPropagation()">${editSafe(x.corrected||x.recognized)}</textarea></div><label class="ocr-check" onclick="event.stopPropagation()"><input type="checkbox" class="ocr-confirm-check" data-index="${i}" onchange="updateOcrProgress()">我已对照原文件并确认该文本</label></div>`).join('');
  const pages=[...new Set(u.ocrItems.map(x=>x.page))].join('、');
  mask.innerHTML=`<div class="ocr-modal"><div class="tpl-head"><div class="tpl-head-main"><b>确认 OCR 识别结果</b><span>${editSafe(u.file)} · 第 ${pages} 页存在 ${u.ocrItems.length} 处低置信文本</span></div><span class="pill p-amb">${u.ocr}</span><button class="drawer-close" onclick="closeOcrConfirm()">×</button></div><div class="ocr-body"><div class="ocr-preview"><div class="ocr-page"><h3>${editSafe(u.file.replace(/\.[^.]+$/,''))}</h3><p>OCR 原文定位与人工确认</p><p>以下内容由扫描页面识别生成,低置信文字已高亮标记。</p>${highlights}<p>人工确认后的文本将用于后续合同审查与风险判断。</p></div></div><aside class="ocr-side"><div class="ocr-side-head"><b>待确认内容</b><span id="ocrProgressText">已确认 0/${u.ocrItems.length}</span></div>${items}</aside></div><div class="drawer-foot"><span class="drawer-meta">低置信内容不会在未确认时进入 AI 审查</span><button class="btn" onclick="closeOcrConfirm()">取消</button><button class="btn primary" id="ocrSubmit" onclick="submitOcrConfirm()" disabled>确认并完成 OCR</button></div></div>`;
  document.body.appendChild(mask);
}
function closeOcrConfirm(){ document.getElementById('ocrConfirmModal')?.remove(); OCR_ACTIVE_INDEX=-1; }
function focusOcrItem(index){
  const target=document.getElementById(`ocrHighlight${index}`);
  target.scrollIntoView({behavior:'smooth',block:'center'});
  target.classList.remove('flash'); requestAnimationFrame(()=>target.classList.add('flash'));
}
function updateOcrProgress(){
  const checks=[...document.querySelectorAll('.ocr-confirm-check')];
  const count=checks.filter(x=>x.checked).length;
  checks.forEach(x=>document.getElementById(`ocrItem${x.dataset.index}`).classList.toggle('done',x.checked));
  document.getElementById('ocrProgressText').textContent=`已确认 ${count}/${checks.length}`;
  document.getElementById('ocrSubmit').disabled=count!==checks.length;
}
function submitOcrConfirm(){
  const u=UPLOADS[OCR_ACTIVE_INDEX];
  if(!u) return;
  u.ocrCorrections=u.ocrItems.map((x,i)=>({page:x.page,label:x.label,text:document.getElementById(`ocrText${i}`).value.trim()}));
  if(u.ocrCorrections.some(x=>!x.text)){ templateEditorToast('确认文本不能为空'); return; }
  const pages=[...new Set(u.ocrItems.map(x=>x.page))].join('、');
  u.ocr='OCR 已确认'; u.os='p-grn'; u.note=`第 ${pages} 页 ${u.ocrItems.length} 处低置信已人工确认`;
  closeOcrConfirm(); render('review','up'); templateEditorToast('OCR 结果已确认,可以进入审查');
}
let REPARSE_ACTIVE_INDEX=-1;
let REPARSE_FILE=null;
function openReparse(index){
  const u=UPLOADS[index];
  if(!u) return;
  REPARSE_ACTIVE_INDEX=index; REPARSE_FILE=null;
  const mask=document.createElement('div');
  mask.id='reparseModal'; mask.className='tpl-mask edit-preview';
  mask.onclick=e=>{ if(e.target===mask) closeReparse(); };
  mask.innerHTML=`<div class="upload-modal" style="width:720px"><div class="tpl-head"><div class="tpl-head-main"><b>重新解析文件</b><span>${editSafe(u.file)} · 上次 OCR 失败</span></div><span class="pill p-red">解析失败</span><button class="drawer-close" onclick="closeReparse()">×</button></div><div class="upload-body"><div class="reparse-diagnostic"><div><label>扫描分辨率</label><span>约 96 DPI · 过低</span></div><div><label>页面倾斜</label><span>最大 4.8°</span></div><div><label>文本层</label><span>未检测到</span></div></div><div class="ignore-warning" style="margin-bottom:16px"><b>失败原因:</b>扫描画面模糊、对比度低且存在页面倾斜。建议上传更清晰文件,或开启图像增强后重新识别。</div><div class="form-sec"><h4>替换原始文件(可选)</h4><div class="upload-drop" id="reparseDrop" style="height:105px" onclick="document.getElementById('reparseFileInput').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="reparseDropFile(event)"><b>点击或拖拽更清晰的 PDF 文件</b><span id="reparseFileLabel">未选择时将重新处理当前文件</span></div><input type="file" id="reparseFileInput" accept=".pdf" hidden onchange="handleReparseFile(this.files[0])"></div><div class="form-sec"><h4>OCR 识别参数</h4><div class="reparse-settings"><label><input type="checkbox" id="reparseEnhance" checked>增强对比度与锐化</label><label><input type="checkbox" id="reparseRotate" checked>自动旋转与纠偏</label><label><input type="checkbox" id="reparseDenoise" checked>去除阴影与噪点</label><label><input type="checkbox" id="reparseTables" checked>保留表格与条款编号</label></div><div class="upload-form" style="margin-top:12px"><div class="field"><label>识别语言</label><select class="form-select" id="reparseLanguage"><option>简体中文 + 英文</option><option>仅简体中文</option></select></div><div class="field"><label>解析页码</label><select class="form-select" id="reparsePages"><option>全部 11 页</option><option>仅失败页面</option></select></div></div></div><div class="upload-error" id="reparseError"></div><div class="upload-progress" id="reparseProgress"><div class="upload-track"><div class="upload-bar" id="reparseBar"></div></div><span id="reparseStatus">正在预处理扫描页面...</span></div></div><div class="drawer-foot"><button class="btn" onclick="closeReparse()">取消</button><button class="btn primary" id="reparseSubmit" onclick="startReparse()">开始重新解析</button></div></div>`;
  document.body.appendChild(mask);
}
function closeReparse(){ document.getElementById('reparseModal')?.remove(); REPARSE_ACTIVE_INDEX=-1; REPARSE_FILE=null; }
function handleReparseFile(file){
  if(!file) return;
  const error=document.getElementById('reparseError'); error.classList.remove('show');
  if(!file.name.toLowerCase().endsWith('.pdf')){ error.textContent='请上传 PDF 文件'; error.classList.add('show'); return; }
  if(file.size>30*1024*1024){ error.textContent='文件超过 30 MB'; error.classList.add('show'); return; }
  REPARSE_FILE=file;
  document.getElementById('reparseFileLabel').textContent=`已选择:${file.name} · ${(file.size/1024/1024).toFixed(2)} MB`;
  document.getElementById('reparseDrop').classList.add('drag');
}
function reparseDropFile(event){ event.preventDefault(); event.currentTarget.classList.remove('drag'); handleReparseFile(event.dataTransfer.files[0]); }
function startReparse(){
  const u=UPLOADS[REPARSE_ACTIVE_INDEX];
  if(!u) return;
  const submit=document.getElementById('reparseSubmit'),progress=document.getElementById('reparseProgress'),bar=document.getElementById('reparseBar');
  submit.disabled=true; progress.classList.add('show'); bar.style.width='25%';
  setTimeout(()=>{ if(!document.getElementById('reparseModal')) return; bar.style.width='55%'; document.getElementById('reparseStatus').textContent='正在纠偏、增强并识别文本...'; },450);
  setTimeout(()=>{ if(!document.getElementById('reparseModal')) return; bar.style.width='82%'; document.getElementById('reparseStatus').textContent='正在恢复条款编号与页面结构...'; },900);
  setTimeout(()=>{
    if(!document.getElementById('reparseModal')) return;
    bar.style.width='100%';

function closeOpinionEmail(){ document.getElementById('opinionEmailModal')?.remove(); }
async function copyOpinionEmailText(){
  const subject=document.getElementById('opinionEmailSubject').value.trim();
  const body=document.getElementById('opinionEmailBody').value.trim();
  const text=`主题:${subject}\n\n${body}`;
  try{
    if(!navigator.clipboard) throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(text);
  }catch(e){
    const temp=document.createElement('textarea');
    temp.value=text; temp.style.position='fixed'; temp.style.opacity='0';
    document.body.appendChild(temp); temp.select(); document.execCommand('copy'); temp.remove();
  }
  closeOpinionEmail();
  templateEditorToast('邮件主题和正文已复制');
}

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${editSafe(o.name)}审核意见</title><style>body{font-family:"Microsoft YaHei",sans-serif;color:#263244;line-height:1.7;margin:46px}h1{text-align:center;font-size:22px}h2{font-size:16px;margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:8px}.meta{text-align:center;color:#777;font-size:12px}.verdict{margin:24px 0;padding:14px;background:#f7f8fa;border-left:4px solid #d33}.issue{margin:22px 0;page-break-inside:avoid}.issue h3{font-size:14px}.issue h3 span{font-size:11px;color:#b42318;margin-left:8px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}th{width:85px;background:#f7f8fa;color:#666}.suggest{color:#087f5b}.pass{padding:16px;background:#ecfdf5;color:#087f5b}</style></head><body><h1>合同审核意见书</h1><div class="meta">${editSafe(o.name)} · ${editSafe(o.code)} · 审查人:${editSafe(o.by)} · ${editSafe(o.date)} · ${editSafe(o.version)} · ${editSafe(o.status)}</div><div class="verdict"><b>结论:${editSafe(o.concl)}(${editSafe(o.risk)}风险)</b><br>${editSafe(o.summary)}</div><h2>审核问题</h2>${issues}</body></html>`;
  const blob=new Blob(['\ufeff',html],{type:'application/msword;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download=`${o.name.replace(/[\\/:*?"<>|]/g,'_')}_审核意见_${o.date}.doc`;
  document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
  templateEditorToast('Word 审核意见已导出');
}

function runDiff(){
  const curId = document.getElementById('verCur').value;
  const baseId = document.getElementById('verBase').value;
  const current = DIFF_CASES.find(x=>x.id===curId);
  const base = current?.bases.find(x=>x.id===baseId);
  const error = document.getElementById('diffSelectError');
  if(!current || !base){ error.textContent='请选择本次版本和基准版本后再开始对比'; error.classList.add('show'); return; }
  error.classList.remove('show');
  const box = document.getElementById('diffResult');
  box.innerHTML = `<div class="note" style="margin:6px 0 12px">正在比对:<b>${current.name} ${current.version}</b> ⟷ <b>${base.name} ${base.version}</b></div>` + diffResultHtml(current.name,base.name);
}

function updateDiffCurrent(){
  const current=DIFF_CASES.find(x=>x.id===document.getElementById('verCur').value);
  const baseSelect=document.getElementById('verBase');
  const currentMeta=document.getElementById('curMeta');
  const baseMeta=document.getElementById('baseMeta');
  document.getElementById('diffSelectError').classList.remove('show');
  document.getElementById('diffResult').innerHTML='<div class="note" style="padding:30px;text-align:center;color:var(--faint)">请选择版本后点击「开始对比」</div>';
  if(!current){
    currentMeta.classList.remove('show'); baseMeta.classList.remove('show');
    baseSelect.innerHTML='<option value="">请先选择本次版本</option>'; baseSelect.disabled=true;
    document.getElementById('diffStart').disabled=true; return;
  }
  currentMeta.innerHTML=versionMetaHtml(current); currentMeta.classList.add('show');
  baseSelect.disabled=false;
  baseSelect.innerHTML='<option value="">请选择基准版本</option>'+current.bases.map(v=>`<option value="${v.id}">${v.name}</option>`).join('');
  baseMeta.classList.remove('show');
  document.getElementById('diffStart').disabled=true;
}
function updateDiffBase(){
  const current=DIFF_CASES.find(x=>x.id===document.getElementById('verCur').value);
  const base=current?.bases.find(x=>x.id===document.getElementById('verBase').value);

function reminderActionHtml(r){
  if(r.processed) return `<div class="rule-summary"><b style="color:var(--grn)">处理结果:${editSafe(r.result)}</b><br>${editSafe(r.note||'未填写处理备注')}${r.attachment?`<br>附件:${editSafe(r.attachment)}`:''}</div>`;
  const options={
    decision:[["续约","确认续约"],["不续约","发起不续约通知"]],
    acceptance:[["验收通过","确认验收通过"],["验收不通过","退回整改"]],
    payment:[["已付款","登记付款完成"],["申请延期","提交延期申请"]],
    evaluation:[["建议续订","提交续订意见"],["不建议续订","提交终止意见"]]

    <div class="rem-section" id="reminderAction"><h4>${r.processed?'处理结果':r.action}</h4>${reminderActionHtml(r)}</div>
  </div><div class="drawer-foot"><button class="btn" onclick="closeReminderDetail()">关闭</button>${r.processed?'':`<button class="btn primary" onclick="saveReminderResult(${index})">保存处理结果</button>`}</div></div>`;

function closeReminderDetail(){ document.getElementById('reminderDrawer')?.remove(); }
function saveReminderResult(index){
  const choice=document.querySelector('input[name="reminderChoice"]:checked');
  const error=document.getElementById('reminderError');
  if(!choice){ error.textContent='请选择本次处理结果'; error.classList.add('show'); return; }
  const r=REMINDERS[index];
  r.result=choice.value;
  r.note=document.getElementById('reminderNote').value.trim();
  const file=document.getElementById('reminderAttachment')?.files[0];
  if(file) r.attachment=file.name;
  r.processed=true;
  r.timeline.push(['2026-07-12',`${r.owner}完成处理:${r.result}`]);
  closeReminderDetail();
  render('remind');
  templateEditorToast(`“${r.title}”已完成处理`);
}

function updateNewRuleSummary(){
  const condition = document.getElementById('ruleCondition').value.trim();
  const level = document.getElementById('ruleLevel').value;
  document.getElementById('ruleSummary').textContent = condition ? `审查发现“${condition}”时,判定为${level==='高'?'高风险红线':'中风险谈判项'}。` : '填写判定条件后,这里将生成规则摘要。';
}
function syncNewRuleLevel(){
  const hard = document.getElementById('ruleLevel').value==='高';
  document.getElementById('ruleFinal').checked = hard;
  document.getElementById('ruleBlock').checked = hard;
  document.getElementById('hardHint').classList.toggle('show',hard);
  updateNewRuleSummary();
}
function ruleFieldError(id,message){
  const el = document.getElementById(id);
  el.classList.add('invalid');
  const error = document.createElement('span');
  error.className = 'field-error';
  error.textContent = message;
  el.parentElement.appendChild(error);
}
function saveRule(index,enable,isNew=false){
  document.querySelectorAll('#ruleDrawer .field-error').forEach(e=>e.remove());
  document.querySelectorAll('#ruleDrawer .invalid').forEach(e=>e.classList.remove('invalid'));
  const r = {
    name:document.getElementById('ruleName').value.trim(),
    type:document.getElementById('ruleType').value,
    level:document.getElementById('ruleLevel').value,
    enabled:enable ? true : (isNew ? false : document.getElementById('ruleEnabled').checked),
    condition:document.getElementById('ruleCondition').value.trim(),
    suggestion:document.getElementById('ruleSuggestion').value.trim(),
    basis:document.getElementById('ruleBasis').value.trim(),
    scope:document.getElementById('ruleScope').value.trim()
  };
  let invalid = false;
  if(!r.name){ ruleFieldError('ruleName','请输入规则名称'); invalid=true; }
  else if(REDLINE_RULES.some((x,i)=>x.name===r.name && (isNew || i!==index))){ ruleFieldError('ruleName','规则名称已存在'); invalid=true; }
  if(!r.type){ ruleFieldError('ruleType','请选择条款类型'); invalid=true; }
  if(!r.condition){ ruleFieldError('ruleCondition','请输入判定条件'); invalid=true; }
  if(enable && r.level==='高' && !r.suggestion){ ruleFieldError('ruleSuggestion','启用高风险规则前请填写推荐修改建议'); invalid=true; }

  if(invalid) return;
  if(isNew) REDLINE_RULES.unshift(r); else Object.assign(REDLINE_RULES[index],r);
  closeRuleEditor();
  render('rules','redline');
  if(isNew){
    document.querySelector('#content tbody tr')?.classList.add('new-rule-row');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = `规则“${r.name}”已${enable?'保存并启用':'保存为草稿'}`;

  }

    {title:"二、保密信息的范围",body:["保密信息是指披露方以书面、口头、视觉、电子或其他形式披露的尚未公开信息,包括技术方案、源代码、算法、产品路线、财务、价格、客户、供应商、合同、个人信息及商业计划。","口头或现场展示的信息在披露时表明其保密性质,或依其性质和披露场景合理应被理解为保密信息的,同样受本协议保护。双方合作的存在、谈判内容及本协议条款亦属于保密信息。"]},
    {title:"三、使用限制与保护义务",body:["接收方仅可为合作目的使用保密信息,不得为自身或第三方竞争利益使用,不得对样品、软件或技术成果进行反向工程、反编译或拆解,但法律明确允许且不可排除的除外。","接收方应采取不低于保护自身同类重要信息且不低于合理商业标准的措施保护保密信息,包括权限控制、访问记录、加密存储及安全传输。"]},
    {title:"四、允许披露的人员",body:["接收方仅可向确有知悉必要的员工、关联方、专业顾问及经披露方书面同意的合作方披露保密信息,前提是该等人员受到不低于本协议标准的保密义务约束。","接收方应对上述人员违反保密义务的行为承担责任,并在发现未经授权使用或披露后立即通知披露方、采取补救措施并配合调查。"]},
    {title:"五、不属于保密信息的情形",body:["接收方能够以书面记录证明下列信息不属于保密信息:披露时已为公众知悉;非因接收方违约而公开;披露前已由接收方合法掌握;从有权披露的第三方合法取得;未使用保密信息而独立开发。","保密信息的个别组成部分公开,不当然导致其组合、结构或应用方式失去保密性。"]},
    {title:"六、依法强制披露",body:["接收方因法律法规、监管机构或司法机关要求必须披露保密信息时,应在法律允许范围内提前书面通知披露方,使披露方有机会申请保护措施。","接收方仅披露依法必须披露的最小范围,并应尽合理努力争取对所披露信息给予保密处理。"]},
    {title:"七、个人信息与数据安全",body:["保密信息包含个人信息、重要数据或受监管数据的,接收方应遵守适用的数据保护法律,仅按披露方书面指示处理并采取相应安全措施。","未经披露方书面同意,接收方不得将相关数据提供给第三方或传输至境外。发生泄露、丢失或未经授权访问时,接收方应立即通知并协助处置。"]},
    {title:"八、权利归属与无授权",body:["保密信息及其相关知识产权始终归披露方或其权利人所有。除为合作目的有限使用外,披露不构成任何专利、著作权、商标、商业秘密或其他权利的许可或转让。","除双方另有书面约定外,披露方不对保密信息的完整性或适用性作出保证,也不因信息披露承担达成交易或继续谈判的义务。"]},
    {title:"九、返还、销毁与留存",body:["披露方提出要求或双方洽谈终止时,接收方应在十个工作日内返还或安全销毁全部保密信息及其复制件,并应要求提供书面销毁确认。","因法律、监管或自动备份机制必须留存的副本可继续保留,但不得用于任何其他目的,并在留存期间持续受本协议约束。"]},
    {title:"十、保密期限",body:["本协议自双方签署之日起生效,有效期为____年。接收方的保密义务在本协议终止后持续五年。","构成商业秘密的信息,其保密义务持续至该信息非因接收方违约而合法进入公知领域;个人信息的保护期限按适用法律和处理目的确定。"]},
    {title:"十一、违约责任与救济",body:["任何一方违反本协议造成对方损失的,应承担赔偿责任,包括调查、取证、数据恢复、第三方索赔及合理维权费用。","双方确认未经授权披露可能造成难以弥补的损害,守约方除请求损害赔偿外,有权依法申请禁令、行为保全或其他救济。"]},
    {title:"十二、法律适用与签署",body:["本协议适用中华人民共和国法律。因本协议产生的争议,双方应协商解决;协商不成的,向原告所在地有管辖权的人民法院提起诉讼。","本协议不构成合伙、代理、雇佣或排他合作关系。任何修改须经双方书面签署。本协议可采用可靠电子签名并分份签署。","甲方(盖章):__________  授权代表:__________。乙方(盖章):__________  授权代表:__________。签署日期:____年__月__日。"]}
  ]},
  {name:"框架采购协议模板",status:"已启用",version:"V2.9",updated:"2026-02-16",scope:"长期、多批次采购",note:"用于长期 / 多批次采购",review:"2027-02-16",sections:[
    {title:"一、协议目的与合作范围",body:["甲方(采购方):__________。乙方(供应方):__________。本协议约定双方长期、多批次采购合作的通用商务及法律条件。","具体货物、规格、数量、价格、交付地点和交期以甲方不时签发并经乙方确认的采购订单为准。本协议不构成甲方最低采购量或排他采购承诺。"]},
    {title:"二、订单签发与成立",body:["甲方可通过采购系统、电子邮件或书面方式发出订单。乙方应在两个工作日内确认;乙方开始备货、生产或交付的,视为接受订单全部内容。","乙方对订单有异议的,应在确认期限内一次性书面提出。未经甲方书面同意,乙方不得擅自取消、拒绝或变更已生效订单。"]},
    {title:"三、文件构成与效力顺序",body:["本协议、补充协议、采购订单、技术规格书、质量协议及甲方供应商管理制度共同构成交易文件。","文件内容冲突时,适用顺序为双方签署的补充协议、本协议、采购订单、技术规格书、质量协议及其他文件;采购订单明确写明变更本协议具体条款的除外。乙方单方格式条款不具有约束力。"]},
    {title:"四、价格与成本改善",body:["订单价格为含税到岸价,包含包装、运输、保险、检测、税费及履约全部成本。未经甲方书面同意,乙方不得调整价格。","原材料或市场价格下降、生产效率提高或采购规模扩大时,乙方应主动与甲方协商降价。乙方向其他同等条件客户提供更优惠价格的,应同步适用于甲方。"]},
    {title:"五、需求预测与供应保障",body:["甲方提供的滚动需求预测仅用于乙方安排产能,不构成采购承诺。乙方应根据预测保持合理产能和安全库存。","乙方预见产能不足、原料短缺、停产或其他供应风险时,应至少提前三十日书面预警并提交连续供应方案,不得在未协商情况下按客户比例削减甲方供应。"]},
    {title:"六、交付、包装与风险",body:["乙方应严格按照订单日期、数量和地点交付。提前交付、分批交付或替代交付须经甲方书面同意。","货物应采用符合运输及仓储要求的包装并附完整单证。毁损灭失风险在货物送达指定地点并经甲方验收合格后转移。签收物流单据不代表验收。"]},
    {title:"七、质量管理与变更控制",body:["乙方应建立符合适用标准的质量管理体系,确保货物持续满足技术规格。甲方有权开展现场审核、过程检查和样品测试。","未经甲方书面批准,乙方不得变更生产地点、关键原材料、工艺、设备、二级供应商或检验标准。经批准的变更不减轻乙方质量责任。"]},
    {title:"八、验收与不合格品处理",body:["甲方可在收货后进行数量、外观、性能及可靠性检验。验收期限不限制甲方就隐蔽缺陷、批次性问题或潜在缺陷主张权利。","对不合格货物,甲方可选择拒收、退货、换货、返工、降价或委托第三方处理。乙方应承担筛选、返运、停线、加急替代和再次检验等费用。"]},
    {title:"九、付款与对账",body:["双方按月对账。乙方应在验收合格后提交对账单及合法有效发票,甲方在对账确认且资料齐备后____日内付款。","甲方有权从应付乙方的任何款项中抵扣乙方应承担的违约金、赔偿款及其他到期债务。存在质量争议的,甲方可暂缓支付争议部分。"]},
    {title:"十、质量保证与召回",body:["质保期为验收合格后____个月。质保期内及合理使用寿命内发生批次性或安全性缺陷的,乙方应立即调查、制定纠正措施并承担维修、更换或召回责任。","因质量问题导致甲方停产、客户索赔、监管处罚或产品召回的,乙方应承担全部可归责损失及合理处置费用。"]},
    {title:"十一、知识产权与保密",body:["乙方保证货物及制造、销售、使用不侵犯第三方权利。侵权争议由乙方负责处理,并确保甲方业务不受影响。","乙方对甲方提供的图纸、模具、样品、预测、价格及业务信息承担保密义务,不得用于为第三方生产或销售。甲方提供或出资形成的工装、模具归甲方所有。"]},
    {title:"十二、合规与业务连续性",body:["乙方应遵守反贿赂、出口管制、环境、职业健康、劳动权益及供应链尽责等法律要求,并推动其二级供应商遵守同等标准。","乙方应建立灾难恢复、关键设备备份和替代供应方案,每年至少测试一次业务连续性计划,并按甲方要求提供结果。"]},
    {title:"十三、违约、解除与退出",body:["乙方逾期交付的,按逾期订单金额每日0.05%支付违约金;连续或重大违约、质量事故、商业贿赂或丧失履约能力的,甲方有权立即解除协议及未履行订单。","协议终止时,乙方应按甲方要求完成在途订单、返还甲方资产和资料,并在合理期限内提供供应切换协助。终止不影响保密、知识产权、质量保证及责任条款继续有效。"]},
    {title:"十四、期限、通知与争议",body:["本协议有效期自____年__月__日至____年__月__日,到期不自动续展。续签须经双方书面确认。","本协议适用中华人民共和国法律。争议协商不成的,任一方可向甲方所在地有管辖权的人民法院起诉。通知按协议所列地址或电子邮箱送达。"]},
    {title:"十五、签署页",body:["本协议附件及经双方签署的补充文件为协议组成部分。未尽事宜由双方另行协商。本协议自双方盖章之日起生效。","甲方(盖章):__________  法定代表人/授权代表:__________  日期:____年__月__日。","乙方(盖章):__________  法定代表人/授权代表:__________  日期:____年__月__日。"]}
  ]},
  {name:"SaaS 订购单审查清单",status:"草稿",version:"V0.8",updated:"2026-06-12",scope:"SaaS订购单及配套在线条款",note:"针对并入条款、续约、责任上限",review:"待首次发布",checklist:true,sections:[
    {title:"一、交易文件与主体",body:["订购方、服务商及实际使用主体的名称、注册地址和签约权限是否准确","订购单、主服务协议(MSA)、服务等级协议(SLA)、数据处理协议(DPA)及产品规则是否全部取得","各交易文件的效力顺序是否明确,订购单及双方签署文件是否优先于供应商在线条款","网页条款是否已下载固化为签署日版本并作为附件,供应商是否无权单方更新后自动约束客户","产品名称、版本、账号数量、部署区域、服务期限及使用范围是否清晰且与报价一致"]},
    {title:"二、价格、付款与税务",body:["费用是否明确为含税固定价格,币种、税率、计费单位和总价计算是否一致","一次性费用、订阅费、超量费、接口费、实施费、培训费及续费价格是否完整列明","付款是否与账号开通、实施里程碑或验收结果挂钩,避免无条件全额预付","发票类型和开具时间是否满足公司财务要求,供应商未提供合规发票时付款期限是否顺延","是否限制供应商单方涨价;续费调价是否需提前通知并经客户书面同意","是否删除信用卡自动扣款、不可退款及客户承担全部税费等不合理安排"]},
    {title:"三、期限、续约与终止",body:["服务起止日期、试用期和正式计费起点是否明确,实施延迟时服务期是否相应顺延","是否存在自动续约;如保留,续约周期、价格及取消窗口是否合理并醒目标示","客户是否可因供应商重大违约、连续未达SLA、安全事件或合规风险单方解除","是否争取客户便利解除权或在业务调整时按未使用期间退还预付费用","供应商暂停服务或解除合同的条件是否限定为客户重大违约并设置合理补救期","终止后账号访问、数据导出、迁移协助及数据删除的期限和费用是否明确"]},
    {title:"四、实施、验收与支持",body:["实施范围、双方分工、项目计划、里程碑、交付成果及关键人员是否在附件中明确","验收标准是否客观可量化,是否避免“上线即验收”“沉默即验收”或过短验收期","未通过验收时是否约定免费整改、重新验收、延期违约责任及最终解除权","技术支持渠道、响应时间、服务时间和问题分级是否与业务重要性匹配","版本升级、维护窗口和功能下线是否须提前通知,且不得实质降低已购功能"]},
    {title:"五、SLA与业务连续性",body:["月度可用性承诺、计算公式、排除事项和监测数据来源是否明确","计划维护、不可抗力及客户原因等排除项是否范围合理,是否避免供应商无限扩大免责","未达SLA的服务抵扣是否自动适用,且不作为客户唯一救济","连续或多次未达SLA时,客户是否有权解除并获得未使用费用退款","备份频率、恢复点目标(RPO)、恢复时间目标(RTO)、灾备地域和演练频率是否满足业务要求","供应商是否应提供业务连续性计划,并在重大故障期间及时通报进展和恢复预计时间"]},
    {title:"六、数据权利与个人信息",body:["客户及其用户对输入数据、业务数据和输出数据的所有权是否明确归客户所有","供应商处理数据的目的、范围、期限和方式是否仅限提供合同服务所必需","双方作为个人信息处理者或受托人的角色、责任及处理指示是否在DPA中明确","供应商是否限制分处理者使用并对其行为负责,新增或更换分处理者是否提前通知客户","数据存储地点和跨境传输安排是否符合适用法律及公司政策","供应商是否被禁止将客户数据用于广告、画像、产品训练或人工智能模型训练,除非取得单独书面授权"]},
    {title:"七、信息安全与事件响应",body:["供应商是否承诺符合ISO 27001、等保或公司要求的安全控制并定期提供审计报告","访问控制、最小权限、多因素认证、加密传输、静态加密、日志留存及漏洞管理是否明确","客户是否享有合理的安全审计、问卷评估和整改跟踪权利","安全事件通知时限是否不超过发现后24小时,并包含事件范围、影响数据和补救措施","供应商是否承担取证、通知、数据恢复和监管配合义务,不得未经客户同意公开披露事件","合同终止后数据返还、可读格式导出、备份清除和书面删除证明是否明确"]},
    {title:"八、知识产权与第三方组件",body:["SaaS平台和客户数据的权利边界是否明确,客户配置、定制成果和接口开发成果的归属是否符合项目需求","供应商是否保证服务不侵犯第三方知识产权并承担抗辩、赔偿和替换义务","开源软件、第三方组件及其许可限制是否充分披露,是否会导致客户代码或数据被强制开放","供应商是否取得提供服务所需的全部许可,且客户正常使用不产生未披露的第三方费用","客户反馈是否仅可用于改进产品,不得因此取得客户数据、品牌或业务成果的所有权"]},
    {title:"九、责任、赔偿与保险",body:["供应商累计责任上限是否不低于合同总额或过去十二个月已付费用中的较高者","数据泄露、保密违约、知识产权侵权、欺诈、故意或重大过失及人身损害是否不适用责任封顶","间接损失排除是否保留数据恢复、替代服务、监管罚款和第三方索赔等可预见损失","供应商对知识产权侵权、数据安全事件及其分包商行为是否承担明确赔偿责任","双方责任是否保持合理对等,是否删除仅要求客户承担无限责任的单边条款","供应商是否维持与风险相匹配的网络安全险、职业责任险或商业综合责任险"]},

function templateValidation(forPublish){
  const t=TEMPLATE_EDIT_DRAFT;
  const errors=[];
  if(!t.name.trim()) errors.push('模板名称不能为空');
  if(!t.sections.length) errors.push('模板至少需要一个章节');
  const names=t.sections.map(s=>s.title.trim());
  if(names.some(x=>!x)) errors.push('章节名称不能为空');
  if(new Set(names).size!==names.length) errors.push('章节名称不能重复');
  if(forPublish && t.sections.some(s=>!s.body.length || s.body.some(x=>!x.trim()))) errors.push(t.checklist?'发布前请补全所有检查项':'发布前请补全所有合同段落');
  if(forPublish && !t.checklist){
    const titles=names.join('');
    const required = /保密|NDA/i.test(t.name)
      ? [['保密信息','信息的范围'],['保密义务','保护义务'],['期限'],['违约','责任'],['争议','法律适用']]
      : [['主体','合作范围'],['价款','费用','价格'],['交付','验收','服务','订单'],['违约','责任'],['争议']];
    required.forEach(group=>{
      if(!group.some(word=>titles.includes(word))) errors.push(`正式合同缺少“${group.join('/')}”核心章节`);
    });
  }
  return errors;
}

function handleTemplateFile(file){

function cleanUploadValue(value){ return String(value).trim().replace(/[<>]/g,''); }
function submitTemplateUpload(){
  const name=cleanUploadValue(document.getElementById('uploadTemplateName').value);
  const type=document.getElementById('uploadTemplateType').value;
  const version=cleanUploadValue(document.getElementById('uploadTemplateVersion').value);
  const scope=cleanUploadValue(document.getElementById('uploadTemplateScope').value);
  const note=cleanUploadValue(document.getElementById('uploadTemplateNote').value);
  const review=document.getElementById('uploadTemplateReview').value;
  document.getElementById('templateUploadError').classList.remove('show');
  if(!TEMPLATE_UPLOAD_FILE){ showTemplateUploadError('请先选择需要上传的模板文件'); return; }
  if(!name){ showTemplateUploadError('请输入模板名称'); return; }
  if(TEMPLATE_PREVIEWS.some(t=>t.name===name)){ showTemplateUploadError('模板名称已存在,请修改后重试'); return; }
  if(!/^V\d+\.\d+$/.test(version)){ showTemplateUploadError('版本号格式应为 V1.0'); return; }
  if(!scope){ showTemplateUploadError('请输入适用合同类型'); return; }
  const submit=document.getElementById('templateUploadSubmit');
  const progress=document.getElementById('templateUploadProgress');
  const bar=document.getElementById('templateUploadBar');
  submit.disabled=true; progress.classList.add('show'); bar.style.width='38%';
  setTimeout(()=>{ bar.style.width='72%'; document.getElementById('templateUploadStatus').textContent='正在识别章节与条款结构...'; },450);
  setTimeout(()=>{
    bar.style.width='100%';
    const fileName=TEMPLATE_UPLOAD_FILE.name;
    const checklist=type==='checklist';
    const sections=checklist ? [
      {title:'一、导入检查项',body:[`已从“${fileName}”识别检查内容,请进入编辑工作台逐项核对。`]},
      {title:'二、发布前核对',body:['确认检查项分类、风险口径与适用合同范围后再发布。']}
    ] : [
      {title:'一、合同主体',body:[`本章节由“${fileName}”导入生成,请核对合同双方名称、地址、联系人及签约权限。`]},
      {title:'二、合同标的与价款',body:['请核对合同标的、规格数量、含税金额、税率及费用构成。']},
      {title:'三、履行与验收',body:['请核对履行期限、交付地点、验收标准、整改机制及风险转移安排。']},
      {title:'四、违约责任',body:['请核对逾期履行、质量不合格、保密及知识产权违约责任。']},
      {title:'五、争议解决',body:['请核对法律适用、争议管辖、通知送达及合同生效条件。']}
    ];
    TEMPLATE_PREVIEWS.push({name,status:'草稿',version,updated:'2026-07-12',scope,note:note||`由 ${fileName} 上传导入`,review:review||'待确定',checklist,sections,sourceFile:fileName});
    closeTemplateUpload();
    render('rules','template');
    document.querySelector('#content tbody tr:last-child')?.classList.add('new-rule-row');
    templateEditorToast(`“${name}”已上传并生成草稿`);
  },950);
}

function closeContractUpload(){ document.getElementById('contractUpload')?.remove(); CONTRACT_UPLOAD_FILE=null; }
function contractDrag(event,active){ event.preventDefault(); document.getElementById('contractDrop').classList.toggle('drag',active); }
function contractDropFile(event){ event.preventDefault(); document.getElementById('contractDrop').classList.remove('drag'); handleContractFile(event.dataTransfer.files[0]); }
function contractUploadError(message){ const box=document.getElementById('contractUploadError'); box.textContent=message; box.classList.add('show'); }
function handleContractFile(file){
  if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase();
  document.getElementById('contractUploadError').classList.remove('show');
  if(!['doc','docx','pdf'].includes(ext)){ contractUploadError('文件格式不支持,请上传 DOC、DOCX 或 PDF'); return; }
  if(file.size>30*1024*1024){ contractUploadError('文件超过 30 MB,请压缩后重新上传'); return; }
  CONTRACT_UPLOAD_FILE=file;
  document.getElementById('contractFileInfo').classList.add('show');
  document.getElementById('contractFileType').textContent=ext.toUpperCase();
  document.getElementById('contractFileName').textContent=file.name;
  document.getElementById('contractFileSize').textContent=`${(file.size/1024/1024).toFixed(2)} MB · 待上传`;
  const name=document.getElementById('contractName');
  if(!name.value) name.value=file.name.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ');

function contractUploadValues(){
  return {name:document.getElementById('contractName').value.trim().replace(/[<>]/g,''),type:document.getElementById('contractType').value,amount:document.getElementById('contractAmount').value,party:document.getElementById('contractParty').value.trim().replace(/[<>]/g,''),dept:document.getElementById('contractDept').value,owner:document.getElementById('contractOwner').value,template:document.getElementById('contractTemplate').value,background:document.getElementById('contractBackground').value.trim().replace(/[<>]/g,''),rules:[...document.querySelectorAll('input[name="contractRule"]:checked')].map(x=>x.value)};
}
function saveContractUpload(startParse){
  const v=contractUploadValues();
  const error=document.getElementById('contractUploadError'); error.classList.remove('show');
  if(!CONTRACT_UPLOAD_FILE){ contractUploadError('请先选择合同文件'); return; }
  if(!v.name){ contractUploadError('请输入合同名称'); return; }
  if(!v.type){ contractUploadError('请选择合同类型'); return; }
  if(!v.owner){ contractUploadError('请选择提交人或责任人'); return; }
  if(!v.rules.length){ contractUploadError('请至少选择一组审查规则'); return; }
  const file=CONTRACT_UPLOAD_FILE;
  const ext=file.name.split('.').pop().toUpperCase();
  const record={file:file.name,fmt:ext,spec:`${ext==='PDF'?'待识别':'文本型'} · 页数待解析`,ocr:startParse?'解析中':'草稿',os:startParse?'p-blue':'p-grey',by:v.owner,time:'2026-07-12 14:30',note:startParse?`适用规则:${v.rules.join('、')}`:'尚未开始解析',draft:!startParse};
  if(!startParse){
    UPLOADS.unshift(record); closeContractUpload(); render('review','up'); templateEditorToast(`“${v.name}”已保存为上传草稿`); return;
  }
  const submit=document.getElementById('contractUploadSubmit');
  const progress=document.getElementById('contractUploadProgress');
  const bar=document.getElementById('contractUploadBar');
  submit.disabled=true; progress.classList.add('show'); bar.style.width='30%';
  setTimeout(()=>{ if(!document.getElementById('contractUpload')) return; bar.style.width='64%'; document.getElementById('contractUploadStatus').textContent=ext==='PDF'?'正在识别文本层与扫描页面...':'正在解析章节、金额与关键条款...'; },450);
  setTimeout(()=>{
    if(!document.getElementById('contractUpload')) return;
    bar.style.width='100%'; document.getElementById('contractUploadStatus').textContent='解析完成,正在生成审查任务...';
    record.ocr='解析完成'; record.os='p-grn'; record.spec=`${ext==='PDF'?'文本 / OCR':'文本型'} · 页数已识别`; record.draft=false;
    UPLOADS.unshift(record);
    const code=`86741230-${String(1000+DATA.length)}`;
    DATA.unshift({code,name:v.name,type:v.type,by:v.owner,time:'2026-07-12 14:30:00',st:'待审查',dot:'var(--o)',risk:'—',amount:Number(v.amount)||0,currency:'CNY',amountSource:v.amount?'用户填写':'待识别',amountConfirmed:Boolean(v.amount),party:v.party,dept:v.dept,background:v.background});
    setTimeout(()=>{ closeContractUpload(); render('review','up'); templateEditorToast(`“${v.name}”已上传并完成解析`); },350);
  },1050);
}

function notificationPanelHtml(){
  const unread=notificationUnreadCount();
  const items=NOTIFICATIONS.map(n=>`<div class="notify-item ${n.read?'read':''}" onclick="openNotification(${n.id})"><span class="notify-dot"></span><div class="notify-copy"><b>${n.title}</b><p>${n.detail}</p><time>${n.time}</time></div></div>`).join('');

function markAllNotifications(){
  NOTIFICATIONS.forEach(n=>n.read=true);

  const panel=document.getElementById('notificationPanel');

function openNotification(id){
  const item=NOTIFICATIONS.find(n=>n.id===id);
  if(!item) return;
  item.read=true; updateNotificationBell(); document.getElementById('notificationPanel')?.remove();

}
