  function agentPreferences() {
    const pickMemory = (id, pattern) => {
      const relevant = [...state.memories].reverse().find((item) => {
        const text = `${item.title || ""} ${item.value || ""} ${item.detail || ""}`;
        return (
          item.id !== id &&
          pattern.test(text) &&
          (String(item.id).startsWith("memory-") || /用户主动|刚刚的对话/.test(`${item.source || ""} ${item.detail || ""}`))
        );
      });
      return relevant || memoryById(id) || [...state.memories].reverse().find((item) => pattern.test(`${item.title || ""} ${item.value || ""}`));
    };
    const warm = pickMemory("warm-light", /灯|色温|\d{4}\s*K/i);
    const ac = pickMemory("ac-preference", /空调|温度|°?C|℃|\d+\s*度/i);
    const wind = pickMemory("no-strong-wind", /风/);
    const music = pickMemory("evening-music", /音乐|爵士|白噪音|音量/);
    const sleep = pickMemory("sleep-time", /睡|起床/);
    const cleaning = pickMemory("cleaning-time", /清扫|打扫|清洁/);
    const warmText = `${warm?.title || ""} ${warm?.value || ""} ${warm?.detail || ""}`;
    const acText = `${ac?.title || ""} ${ac?.value || ""} ${ac?.detail || ""}`;
    const musicText = `${music?.title || ""} ${music?.value || ""} ${music?.detail || ""}`;
    const sleepText = `${sleep?.title || ""} ${sleep?.value || ""}`;
    const cleaningText = `${cleaning?.title || ""} ${cleaning?.value || ""}`;
    const colorMatch = warmText.match(/(2[2-9]\d{2}|[3-6]\d{3})\s*K/i);
    const brightnessMatch = warmText.match(/(\d{1,3})\s*%/);
    const temperatureMatch = acText.match(/(1[6-9]|2\d|30)\s*(?:°?C|℃|度)?/i);
    const volumeMatch = musicText.match(/(\d{1,3})\s*%/);
    const sleepTimeMatch = sleepText.match(/([01]?\d|2[0-3]):[0-5]\d/);
    const cleaningTimeMatch = cleaningText.match(/([01]?\d|2[0-3]):[0-5]\d/);
    const fanText = `${wind?.value || ""} ${wind?.detail || ""} ${ac?.value || ""} ${ac?.detail || ""}`;
    return {
      colorTemp: colorMatch ? clamp(colorMatch[1], 2700, 6500) : 3000,
      brightness: brightnessMatch ? clamp(brightnessMatch[1], 1, 100) : 60,
      temperature: temperatureMatch ? clamp(temperatureMatch[1], 16, 30) : 26,
      fan: /弱风|小风/.test(fanText)
        ? "弱风"
        : /中风/.test(fanText)
          ? "中风"
          : /强风|大风/.test(fanText) && !/不喜欢|避免/.test(`${wind?.title || ""} ${wind?.value || ""}`)
            ? "强风"
            : "弱风",
      track: /白噪音/.test(musicText) ? "白噪音" : /爵士/.test(musicText) ? "轻爵士" : "轻音乐",
      volume: volumeMatch ? clamp(volumeMatch[1], 0, 100) : 35,
      sleepTime: sleepTimeMatch ? sleepTimeMatch[0].padStart(5, "0") : "23:00",
      cleaningTime: cleaningTimeMatch ? cleaningTimeMatch[0].padStart(5, "0") : "10:00",
      references: {
        warm: warm?.title || "未找到灯光偏好，使用默认 3000K 暖光",
        ac: ac?.title || "未找到空调偏好，使用默认 26°C 弱风",
        wind: wind?.title || "未找到风速偏好，使用默认弱风",
        music: music?.title || "未找到音乐偏好，使用默认轻音乐",
        sleep: sleep?.title || "未找到睡眠习惯，使用默认 23:00",
        cleaning: cleaning?.title || "未找到清扫习惯，使用默认 10:00",
      },
    };
  }

  function deviceSummary(device) {
    if (!device) return "未知设备";
    if (!device.online) return "离线";
    if (device.type === "vacuum" && device.schedule && !device.on) {
      return `已安排 ${device.schedule}`;
    }
    if (!device.on) return "关闭";
    switch (device.type) {
      case "light":
        return `${device.colorTemp <= 3200 ? "暖光" : "自然光"} ${device.brightness}%`;
      case "ac":
        return `${device.temperature}°C · ${device.mode}`;
      case "purifier":

      case "vacuum":

      case "curtain":

      case "speaker":
        return `${device.track || "轻音乐"} · ${device.volume}%`;
      default:
        return "运行中";
    }
  }

        ac.temperature === preferences.temperature &&
        ac.fan === preferences.fan &&
        purifier?.on &&
        speaker?.on &&
        speaker.track === preferences.track &&
        speaker.volume === preferences.volume,
    );
  }

    } else {
      state.demo.lastSummary = "家庭环境已被手动调整，需要时可以重新开启回家模式。";
    }

    if (!original) return;

    const svgOf = (element) => {

    };

        客厅灯: "light",
        空调: "ac",
        空气净化器: "purifier",
        扫地机器人: "vacuum",
        窗帘: "curtain",
        音箱: "speaker",
      };
      if (label && keyMap[label]) assets.icons[keyMap[label]] = svgOf(button);
    });

    original.querySelectorAll(".bottom-nav button").forEach((button) => {
      const label = button.querySelector("small")?.textContent.trim();
      const match = NAV_ITEMS.find((item) => item[1] === label);
      if (match) assets.icons[match[0]] = svgOf(button);
    });

    assets.icons.bell = svgOf(original.querySelector(".round-btn"));
    assets.icons.moon = svgOf(original.querySelector(".home-head h1"));
    assets.icons.temp = svgOf(original.querySelector(".weather-temp"));
    assets.icons.weather = svgOf(original.querySelector(".weather-card > svg"));
    assets.icons.chevron = svgOf(original.querySelector(".section-title button"));
    assets.icons.sparkles = svgOf(original.querySelector(".memory-fab"));
    assets.icons.check = assets.icons.sparkles;
    assets.icons.automation = assets.icons.automation || assets.icons.home;
    runtime.captured = true;
  }

  function icon(key, fallback) {
    return (
      assets.icons[key] ||
      `<span class="ha-fallback-icon" aria-hidden="true">${escapeHtml(fallback || "○")}</span>`
    );
  }

  function robot(className) {
    return assets.robot
      ? `<img class="${className || ""}" src="${assets.robot}" alt="Home Agent 机器人" />`
      : `<span class="ha-robot-fallback" aria-hidden="true">HA</span>`;
  }

  function statusBar() {
    return `<div class="status-bar"><b>${escapeHtml(state.scenario.time)}</b><span>▮▮▮ ᯤ ▰</span></div>`;
  }

  function bottomNav() {
    return `<nav class="bottom-nav" aria-label="主导航">${NAV_ITEMS.map(
      ([id, label]) => `<button type="button" data-action="nav" data-value="${id}" class="${
        state.page === id ? "active" : ""
      }" ${state.page === id ? 'aria-current="page"' : ""} aria-label="${label}">
        ${icon(id, label.slice(0, 1))}<small>${label}</small>
      </button>`,
    ).join("")}</nav>`;
  }

  function shell(content, options) {
    const config = { scroll: true, nav: true, fab: true, detail: false, ...(options || {}) };
    return `<div class="mobile-prototype ${config.detail ? "detail-page" : ""}">
      ${statusBar()}
      <main class="${config.scroll ? "screen scroll" : "screen"}">${content}</main>
      ${config.nav ? bottomNav() : ""}
      ${config.fab ? memoryFab() : ""}
      ${renderSheet()}
      ${renderToast()}
      <div class="ha-live-region" aria-live="polite" aria-atomic="true">${escapeHtml(
        ui.toast || "",
      )}</div>
    </div>`;
  }

  function memoryFab() {
    if (state.page === "memory" || state.page === "chat" || ui.selectedDevice) return "";
    return `<button type="button" class="memory-fab" data-action="nav" data-value="memory" aria-label="家庭记忆" title="家庭记忆">${icon(
      "sparkles",
      "✦",
    )}</button>`;
  }

  function sectionTitle(title, action, actionName) {
    return `<div class="section-title"><b>${escapeHtml(title)}</b>${
      action
        ? `<button type="button" data-action="${action}">${escapeHtml(actionName || "查看全部")}${icon(
            "chevron",
            "›",
          )}</button>`
        : ""
    }</div>`;
  }

  function deviceIcon(device, size) {
    const config = DEVICE_TYPES[device.type] || DEVICE_TYPES.light;
    return `<span class="device-icon ${config.tone === "gold" ? "" : config.tone}">${icon(
      config.icon,
      "○",
    )}</span>`;
  }

  function renderHome() {
    const air = airQuality();
    const greeting = daypart();
    const quickDevices = state.devices.filter((device) => device.room === "客厅").slice(0, 6);
    const extraFavorites = state.devices.filter(
      (device) => device.favorite && !quickDevices.some((item) => item.id === device.id),
    );
    extraFavorites.forEach((device) => {
      const replaceIndex = [...quickDevices]
        .map((item, index) => ({ item, index }))
        .reverse()
        .find(({ item }) => !item.favorite)?.index;
      if (replaceIndex != null) quickDevices.splice(replaceIndex, 1, device);
    });
    const lastRun = [...state.agentRuns].reverse().find((run) => run.intent === "Home_Return");
    const agentAction = state.demo.homeModeActive && lastRun ? "open-run" : "start-home-run";
    const agentLabel = state.demo.homeModeActive ? "查看执行详情" : "开启回家模式";
    const unread = state.notifications.filter((item) => !item.read).length;

    return shell(`<section class="ha-home-hero"><header class="home-head">
      <div><h1>${greeting.en} ${icon(greeting.icon, "◐")}</h1><p>${greeting.zh}，主人 · ${escapeHtml(
        state.scenario.userStatus,
      )}</p></div>
      <button type="button" class="round-btn ha-badge-anchor" data-action="open-notifications" aria-label="通知中心">
        ${icon("bell", "○")}${unread ? `<span class="ha-badge">${unread}</span>` : ""}
      </button>
    </header>
    <section class="weather-card" aria-label="当前天气与场景">
      <div class="weather-temp">${icon("temp", "°")}<strong>${escapeHtml(
        state.scenario.outsideTemp,
      )}°C</strong></div>
      <div><b>${escapeHtml(state.scenario.city)}</b><p>体感 ${escapeHtml(
        state.scenario.feelsLike,
      )}°C · ${escapeHtml(state.scenario.time)}</p></div>
      ${icon("weather", "◌")}
    </section></section>
    <section class="agent-card">
      ${robot("")}
      <div><b>Home Agent 建议</b><p>${escapeHtml(state.demo.lastSummary)}</p></div>
      <button type="button" data-action="${agentAction}" ${
        lastRun ? `data-id="${lastRun.id}"` : ""
      }>${agentLabel}</button>
    </section>
    <div class="status-grid">
      <div>${icon("purifier", "○")}<b class="${air.tone}">${air.label}</b><small>PM2.5 ${escapeHtml(
        state.scenario.pm25,
      )}</small></div>
      <div>${icon("speaker", "○")}<b>${escapeHtml(state.scenario.noise)}dB</b><small>安静</small></div>
    </div>
    ${sectionTitle("常用设备", "nav", "查看全部")}
    <div class="quick-grid">${quickDevices
      .map(
        (device) => `<button type="button" data-action="open-device" data-id="${device.id}" aria-label="${escapeHtml(
          device.name,
        )} ${escapeHtml(deviceSummary(device))}">
          ${deviceIcon(device)}<b>${escapeHtml(device.name)}</b><small class="${
            device.on ? "orange-text" : ""
          }">${escapeHtml(deviceSummary(device))}</small>
        </button>`,
      )
      .join("")}</div>`);
  }

  function renderChatMessage(message) {
    if (message.kind === "run") {
      const run = state.agentRuns.find((item) => item.id === message.runId);
      if (!run) return "";
      const done = run.steps.filter((step) => step.status === "success" || step.status === "skipped").length;
      return `<div class="bubble agent ha-plan-bubble">
        <div class="ha-plan-title"><b>${escapeHtml(run.title)}</b><span>${done}/${run.steps.length}</span></div>
        <p>${escapeHtml(run.reason)}</p>
        <div class="ha-mini-steps">${run.steps
          .map(
            (step) => `<span class="${escapeHtml(step.status)}"><i></i>${escapeHtml(step.label)}</span>`,
          )
          .join("")}</div>
        <button type="button" class="ha-text-button" data-action="open-run" data-id="${run.id}">查看计划与执行详情</button>
      </div>`;
    }

    const completedRelaxRun = [...state.agentRuns]
      .reverse()
      .find((run) => run.intent === "Relax" && ["success", "partial"].includes(run.status));
    const displayActions = Array.isArray(message.actions)
      ? message.actions.map((action) =>
          action.action === "confirm-relax" && completedRelaxRun
            ? { label: "查看放松模式计划", action: "open-run", id: completedRelaxRun.id }
            : action,
        )
      : [];
    const actions = displayActions.length
      ? `<div class="ha-inline-actions">${displayActions
          .map(
            (action) => `<button type="button" class="${action.secondary ? "secondary" : ""}" data-action="${escapeHtml(
              action.action,
            )}" data-message-id="${escapeHtml(message.id)}" ${
              action.id ? `data-id="${escapeHtml(action.id)}"` : ""
            } ${
              action.value ? `data-value="${escapeHtml(action.value)}"` : ""
            }>${escapeHtml(
              action.label,
            )}</button>`,
          )
          .join("")}</div>`
      : "";

    const messageText =
      message.id === "welcome"
        ? `欢迎回来！现在是 ${state.scenario.time}，室外 ${state.scenario.outsideTemp}°C，家里${airQuality().label}。`
        : message.id === "seed-agent"
        ? `辛苦了。需要我开启「放松模式」吗？我会调暗暖光、将空调设为 ${agentPreferences().temperature}°C ${agentPreferences().fan}，并低音量播放${agentPreferences().track}。`
        : message.text;

    return `<div class="bubble ${message.from === "me" ? "me" : "agent"}">${escapeHtml(
      messageText,
    )}${actions}</div>`;
  }

  function renderChat() {
    return shell(`<header class="topbar">
      <button type="button" class="ha-icon-button" data-action="nav" data-value="home" aria-label="返回首页">←</button>
      <div><b>Home Agent</b><small><i></i> 在线</small></div>
      <button type="button" class="ha-icon-button" data-action="open-agent-info" aria-label="关于 Home Agent">•••</button>
    </header>
    <div class="chat-body" data-chat-scroll>
      <div class="robot-stage ha-chat-intro"><span></span>${robot("")}<b>AI Home Agent Demo</b></div>
      <div class="messages">${state.chat.map(renderChatMessage).join("")}
        ${ui.typing ? '<div class="bubble agent ha-typing"><i></i><i></i><i></i></div>' : ""}
      </div>
    </div>
    <div class="suggestions" aria-label="快捷指令">
      <button type="button" data-action="chat-suggestion" data-value="我想睡觉了">我想睡觉了</button>
      <button type="button" data-action="chat-suggestion" data-value="客厅灯暖一点">客厅灯暖一点</button>
      <button type="button" data-action="chat-suggestion" data-value="帮我安排清扫">帮我安排清扫</button>
    </div>
    <form class="chat-input" data-form="chat">
      <label class="ha-sr-only" for="ha-chat-input">输入你想对 Home Agent 说的话</label>
      <input id="ha-chat-input" name="message" autocomplete="off" placeholder="输入你想对我说的话..." />
      <button type="submit" aria-label="发送消息">${icon("chat", "↑")}</button>
    </form>`, { scroll: false, fab: false });
  }

  function memoryRows(items) {
    if (!items.length) {
      return `<div class="ha-empty"><b>还没有记录</b><p>你可以在对话中说“记住我喜欢……”</p></div>`;
    }
    return `<div class="list-card">${items
      .map(
        (item) => `<button type="button" class="habit-row" data-action="open-memory" data-id="${item.id}">
          <span class="device-icon ${item.icon === "temp" ? "blue" : ""}">${icon(
            item.icon || "sparkles",
            "○",
          )}</span>
          <span><b>${escapeHtml(item.title)}</b><small>${escapeHtml(
            item.detail || item.time || "已记录",
          )}</small></span><span aria-hidden="true">›</span>
        </button>`,
      )
      .join("")}</div>`;
  }

  function renderMemory() {
    const habits = state.memories.filter((item) => item.kind === "habit");
    const preferences = state.memories.filter((item) => item.kind === "preference");
    const body =
      ui.memoryTab === "habit"
        ? `${sectionTitle("生活习惯")}${memoryRows(habits)}${sectionTitle("记住的偏好")}
          <div class="preference-grid">${preferences
            .map(
              (item) => `<button type="button" data-action="open-memory" data-id="${item.id}">${escapeHtml(
                item.title,
              )}</button>`,
            )
            .join("")}</div>`
        : `${sectionTitle("最近记忆")}${memoryRows(state.recentMemories)}`;

    return shell(`<header class="page-head"><h1>我的习惯</h1></header>
      <div class="segmented" role="tablist" aria-label="记忆分类">
        <button type="button" role="tab" aria-selected="${ui.memoryTab === "habit"}" class="${
          ui.memoryTab === "habit" ? "active" : ""
        }" data-action="memory-tab" data-value="habit">习惯</button>
        <button type="button" role="tab" aria-selected="${ui.memoryTab === "recent"}" class="${
          ui.memoryTab === "recent" ? "active" : ""
        }" data-action="memory-tab" data-value="recent">记忆</button>
      </div>
      ${body}
      <button type="button" class="memory-note ha-memory-note-button" data-action="add-memory">
        ${robot("")}<p>这些记忆会参与 Agent 的判断。点击这里可以新增或修正记忆。</p>
      </button>`);
  }

  function automationIcons(automation) {
    return `<div class="rule-icons">${automation.actions
      .slice(0, 4)
      .map((id) => {
        const device = deviceById(id);
        const key = device ? DEVICE_TYPES[device.type].icon : id;
        return `<span>${icon(key, "○")}</span>`;
      })
      .join("")}</div>`;
  }

  function renderAutomationCard(automation, recommended) {
    const running = automation.id === "home" && Boolean(runtime.activeRun);
    return `<article class="${recommended ? "recommended" : ""}" ${
      recommended
        ? ""
        : `data-action="automation-detail" data-id="${automation.id}" tabindex="0" role="button" aria-label="${escapeHtml(
            automation.name,
          )}"`
    }>
      <div><b>${escapeHtml(automation.name)}${
        running ? '<span class="running">运行中</span>' : ""
      }</b><p>${escapeHtml(automation.trigger)}</p></div>
      ${
        recommended
          ? `<button type="button" class="ha-add-pill" data-action="add-recommended" data-id="${automation.id}">添加</button>`
          : `<button type="button" class="toggle ${automation.enabled ? "on" : ""}" role="switch" aria-checked="${
              automation.enabled
            }" aria-label="${escapeHtml(automation.name)}" data-action="toggle-automation" data-id="${
              automation.id
            }"><i></i></button>`
      }
      ${automationIcons(automation)}
    </article>`;
  }

  function renderAutomation() {
    const list = ui.automationTab === "mine" ? state.automations : state.recommendations;
    return shell(`<header class="page-head inline"><h1>自动化</h1>
      <button type="button" class="ha-header-icon" data-action="create-automation" aria-label="新增自动化">＋</button>
    </header>
    <div class="automation-tabs" role="tablist" aria-label="自动化分类">
      <button type="button" role="tab" aria-selected="${ui.automationTab === "mine"}" class="${
        ui.automationTab === "mine" ? "active" : ""
      }" data-action="automation-tab" data-value="mine">我的自动化</button>
      <button type="button" role="tab" aria-selected="${ui.automationTab === "recommended"}" class="${
        ui.automationTab === "recommended" ? "active" : ""
      }" data-action="automation-tab" data-value="recommended">推荐自动化</button>
    </div>
    <div class="auto-list">${list
      .map((item) => renderAutomationCard(item, ui.automationTab === "recommended"))
      .join("")}</div>`);
  }

  function renderDeviceGrid(devices) {
    if (!devices.length) {
      return `<div class="ha-empty ha-device-empty"><b>这个房间还没有设备</b><p>可以添加一个模拟设备继续体验。</p><button type="button" data-action="add-device">添加设备</button></div>`;
    }
    return `<div class="device-grid">${devices
      .map(
        (device) => `<button type="button" class="${device.on ? "on" : ""}" data-action="open-device" data-id="${
          device.id
        }" aria-label="${escapeHtml(device.name)} ${escapeHtml(deviceSummary(device))}">
          ${deviceIcon(device)}<span class="mini-status ${device.online ? "online" : ""}"></span>
          <b>${escapeHtml(device.name)}</b><small>${escapeHtml(deviceSummary(device))}</small>
        </button>`,
      )
      .join("")}</div>`;
  }

  function renderDevices() {
    if (ui.selectedDevice) return renderDeviceDetail(deviceById(ui.selectedDevice));
    const rooms = ["全部", "客厅", "卧室", "厨房", "卫生间"];
    const normalDevices = state.devices.filter((device) => device.room !== "阳台");
    const filtered = normalDevices.filter(
      (device) => ui.selectedRoom === "全部" || device.room === ui.selectedRoom,
    );
    const persistentDevices = state.devices.filter((device) => device.room === "阳台");
    return shell(`<header class="page-head inline"><h1>设备</h1>
      <button type="button" class="ha-header-icon" data-action="add-device" aria-label="新增设备">＋</button>
    </header>
    <div class="room-tabs" role="tablist" aria-label="房间筛选">${rooms
      .map(
        (room) => `<button type="button" role="tab" aria-selected="${ui.selectedRoom === room}" class="${
          ui.selectedRoom === room ? "active" : ""
        }" data-action="room-tab" data-value="${room}">${room}</button>`,
      )
      .join("")}</div>
    ${renderDeviceGrid(filtered)}
    ${sectionTitle("常驻设备")}
    <div class="device-grid single">${persistentDevices
      .map(
        (device) => `<button type="button" class="${device.on ? "on" : ""}" data-action="open-device" data-id="${
          device.id
        }">${deviceIcon(device)}<span class="mini-status ${device.online ? "online" : ""}"></span><b>${escapeHtml(
          device.name,
        )}</b><small>${escapeHtml(deviceSummary(device))}</small></button>`,
      )
      .join("")}</div>`);
  }

  function controlRow(device, field, label, valueLabel, min, max, step) {
    return `<div class="ha-control-block">
      <div class="level-row"><span><small>${escapeHtml(label)}</small><b data-output-for="${field}">${escapeHtml(
        valueLabel,
      )}</b></span><span aria-hidden="true">›</span></div>
      <input class="range" type="range" min="${min}" max="${max}" step="${step || 1}" value="${escapeHtml(
        device[field],
      )}" data-device-field="${field}" data-id="${device.id}" aria-label="${escapeHtml(label)}" ${
        device.online ? "" : "disabled"
      } />
    </div>`;
  }

  function deviceControls(device) {
    switch (device.type) {
      case "light":
        return `${controlRow(
          device,
          "brightness",
          "亮度",
          `${device.on ? device.brightness : 0}%`,
          0,
          100,
          1,
        )}${controlRow(
          device,
          "colorTemp",
          "色温",
          `${device.colorTemp}K ${device.colorTemp <= 3200 ? "暖白色" : "自然光"}`,
          2700,
          6500,
          100,
        )}`;
      case "ac":
        return `${controlRow(
          device,
          "temperature",
          "目标温度",
          `${device.temperature}°C`,
          16,
          30,
          1,
        )}${controlRow(
          device,
          "fanLevel",
          "风速",
          `${device.fanLevel || 1} 档 · ${device.fan}`,
          1,
          3,
          1,
        )}`;
      case "purifier":
        return `${controlRow(
          device,
          "fanLevel",
          "净化风速",
          `${device.fanLevel} 档`,
          1,
          3,
          1,
        )}<div class="ha-metric-card"><span>当前空气</span><b>PM2.5 ${escapeHtml(
          state.scenario.pm25,
        )}</b><small>${airQuality().label}</small></div>`;
      case "vacuum":
        return `<div class="ha-metric-grid"><div><span>电量</span><b>${escapeHtml(
          device.battery,
        )}%</b></div><div><span>状态</span><b>${escapeHtml(device.status)}</b></div></div>
          <button type="button" class="level-row" data-action="reschedule-cleaning"><span><small>清扫计划</small><b>${escapeHtml(
            device.schedule || "未安排",
          )}</b></span><span aria-hidden="true">›</span></button>`;
      case "curtain":
        return controlRow(
          device,
          "position",
          "打开幅度",
          `${device.position}%`,
          0,
          100,
          5,
        );
      case "speaker":
        return `${controlRow(
          device,
          "volume",
          "音量",
          `${device.volume}%`,
          0,
          100,
          1,
        )}<button type="button" class="level-row" data-action="speaker-track"><span><small>正在播放</small><b>${escapeHtml(
          device.track || "轻音乐",
        )}</b></span><span aria-hidden="true">›</span></button>`;
      default:
        return "";
    }
  }

  function renderDeviceDetail(device) {
    if (!device) {
      ui.selectedDevice = null;
      return renderDevices();
    }
    const powerLabel = device.type === "vacuum" ? (device.on ? "暂停" : "开始") : "开关";
    return shell(`<header class="topbar simple">
      <button type="button" data-action="back-devices" aria-label="返回设备列表">←</button>
      <b>${escapeHtml(device.name)}</b>
      <button type="button" class="ha-icon-button" data-action="device-more" data-id="${device.id}" aria-label="更多设备设置">•••</button>
    </header>
    <div class="light-orb ${device.on ? "on" : ""}">${icon(
      DEVICE_TYPES[device.type]?.icon || "light",
      "○",
    )}</div>
    ${deviceControls(device)}
    ${
      device.timer
        ? `<div class="ha-summary-card"><span>设备定时</span><b>${escapeHtml(device.timer)}</b><p>${
            device.timerCommand === "on" ? "到时自动开启" : "到时自动关闭"
          }</p></div>`
        : ""
    }
    <div class="detail-actions">
      <button type="button" class="${device.on ? "active" : ""}" data-action="toggle-device" data-id="${
        device.id
      }">${icon("home", "○")}<small>${powerLabel}</small></button>
      <button type="button" class="${device.favorite ? "active" : ""}" data-action="favorite-device" data-id="${
        device.id
      }">${icon("sparkles", "☆")}<small>收藏</small></button>
      <button type="button" data-action="device-timer" data-id="${device.id}">${icon(
        "automation",
        "◷",
      )}<small>定时</small></button>
      <button type="button" data-action="device-more" data-id="${device.id}"><span aria-hidden="true">•••</span><small>更多</small></button>
    </div>`, { nav: false, fab: false, detail: true, scroll: false });
  }

  function renderProfile() {
    const settingsRows = [
      ["open-notifications", "通知中心", "bell"],
      ["open-help", "帮助与反馈", "chat"],
      ["open-settings", "设置", "automation"],
      ["open-about", "关于 Home Agent", "sparkles"],
    ];
    return shell(`<header class="page-head"><h1>我的</h1></header>
      <div class="profile"><div class="avatar">陈</div><div><b>主人</b><p>欢迎回来，今天也要开心呀！</p></div></div>
      ${sectionTitle("家庭管理")}
      <button type="button" class="family-card" data-action="open-family">

  function renderRunSheet(run) {
    if (!run) return "";
    const pending = run.steps.find((step) => step.policy === "confirm" && step.status === "waiting");
    const failed = run.steps.some((step) => step.status === "failed");
    return sheetFrame("Agent 计划与执行", `<div class="ha-context-card">
      <span>感知</span><p>${run.context.map(escapeHtml).join(" · ")}</p>
    </div>
    <div class="ha-context-card"><span>引用记忆</span><p>${run.memories.map(escapeHtml).join(" · ")}</p></div>
    <div class="ha-run-list">${run.steps
      .map(
        (step) => `<div class="ha-run-step ${escapeHtml(step.status)}"><i></i><span><b>${escapeHtml(
          step.label,
        )}</b><small>${escapeHtml(step.detail || policyLabel(step.policy))}</small></span><em>${escapeHtml(
          statusLabel(step.status),
        )}</em></div>`,
      )
      .join("")}</div>
    ${
      pending
        ? `<div class="ha-sheet-actions"><button type="button" data-action="confirm-cleaning" data-value="${escapeHtml(
            pending.args?.schedule || `明天 ${agentPreferences().cleaningTime}`,
          )}">确认${escapeHtml(
            pending.args?.schedule || `明天 ${agentPreferences().cleaningTime}`,
          )}</button><button type="button" class="secondary" data-action="reschedule-cleaning">换个时间</button></div>`
        : ""
    }
    ${
      failed
        ? `<div class="ha-sheet-actions"><button type="button" data-action="retry-run" data-id="${run.id}">重试失败任务</button></div>`
        : ""
    }
    ${
      run.summary
        ? `<div class="ha-summary-card"><b>执行总结</b><p>${escapeHtml(run.summary)}</p></div>`
        : ""
    }`);
  }

  function sheetFrame(title, body, wide) {
    return `<div class="ha-sheet-backdrop" data-action="close-sheet">
      <section class="ha-sheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${escapeHtml(
        title,
      )}" data-sheet-panel>
        <header><b>${escapeHtml(title)}</b><button type="button" data-action="close-sheet" aria-label="关闭">×</button></header>
        <div class="ha-sheet-body">${body}</div>
      </section>
    </div>`;
  }
