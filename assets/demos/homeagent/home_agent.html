  function renderToast() {
    return ui.toast ? `<div class="ha-toast">${icon("check", "✓")}<span>${escapeHtml(ui.toast)}</span></div>` : "";
  }

  function render() {
    let html = "";
    switch (state.page) {
      case "chat":
        html = renderChat();
        break;
      case "memory":
        html = renderMemory();
        break;
      case "automation":
        html = renderAutomation();
        break;
      case "devices":
        html = renderDevices();
        break;
      case "profile":
        html = renderProfile();
        break;
      default:
        html = renderHome();
    }
    root.innerHTML = `<div class="app-canvas ha-complete-app">${html}</div>`;
    requestAnimationFrame(() => {
      if (state.page === "chat") {
        const scroll = root.querySelector("[data-chat-scroll]");
        if (scroll) scroll.scrollTop = scroll.scrollHeight;
      }
      const sheetKey = ui.sheet ? `${ui.sheet.type}:${ui.sheet.id || ""}` : "";
      if (sheetKey && runtime.focusedSheet !== sheetKey) {
        const focusTarget = root.querySelector(
          '[role="dialog"] input:not([type="hidden"]), [role="dialog"] select, [role="dialog"] button',
        );
        if (focusTarget) focusTarget.focus();
      }
      runtime.focusedSheet = sheetKey;
    });
  }

  function showToast(message) {
    ui.toast = message;
    render();
    clearTimeout(runtime.toastTimer);
    runtime.toastTimer = setTimeout(() => {
      ui.toast = null;
      render();
    }, 2200);
  }

  function addChat(from, text, extra) {
    const message = { id: uid("message"), from, text, kind: "text", ...(extra || {}) };
    state.chat.push(message);
    persist();
    render();
    return message;
  }

  function addRecentMemory(title, detail, iconKey) {
    state.recentMemories.unshift({
      id: uid("recent"),
      title,
      detail,
      time: "刚刚",
      icon: iconKey || "sparkles",
    });
    state.recentMemories = state.recentMemories.slice(0, 12);
  }

  function classifyIntent(text) {
    const value = text.trim();
    if (/^(记住|请记住|以后记得)/.test(value)) return { intent: "Memory_Add", text: value };
    if (/(我回来了|到家了|刚到家|回家了)/.test(value)) return { intent: "Home_Return" };
    if (/(累|放松|休息一下|舒服一点)/.test(value)) return { intent: "Relax" };
    if (/(睡觉|睡了|晚安|睡眠)/.test(value)) return { intent: "Sleep" };
    if (/(清扫|打扫|扫地|清洁)/.test(value)) return { intent: "Cleaning" };
    if (/(灯|空调|净化器|音乐|音箱|窗帘|温度|亮度)/.test(value)) {
      return { intent: "Device_Command", text: value };
    }
    return { intent: "General", text: value };
  }

  function planStep(deviceId, label, command, args, policy, detail) {
    return {
      id: uid("step"),
      deviceId,
      label,
      command,
      args: args || {},
      policy: policy || "auto",
      status: policy === "confirm" ? "waiting" : "pending",
      detail: detail || "",
    };
  }

  function isQuietHours(time) {
    const hour = Number(String(time || "20:00").split(":")[0]);
    return hour >= 20 || hour < 8;
  }

  function createPlan(intent, options) {
    const scenario = state.scenario;
    const preferences = agentPreferences();
    const cleaningSchedule = `明天 ${preferences.cleaningTime}`;
    const common = {
      id: uid("run"),
      intent,
      createdAt: new Date().toISOString(),
      status: "planning",
      context: [
        `${scenario.time}`,
        `室外 ${scenario.outsideTemp}°C`,
        scenario.userStatus,
        `PM2.5 ${scenario.pm25}`,
      ],
      memories: [],
      steps: [],
      reason: "",
      summary: "",
      source: options?.source || "chat",
    };

    if (intent === "Home_Return") {
      common.title = "回家模式";
      common.reason = `晚上气温偏低，结合你的 ${preferences.colorTemp}K 暖光、${preferences.temperature}°C ${preferences.fan}与${preferences.track}偏好，先执行低风险环境调整。`;
      common.memories = [
        preferences.references.warm,
        preferences.references.ac,
        preferences.references.music,
        memoryReference("quiet-home", "夜间避免噪音"),
      ];
      common.steps = [
        planStep("light", "打开客厅暖光", "light_on", {
          brightness: preferences.brightness,
          colorTemp: preferences.colorTemp,
        }),
        planStep("ac", `空调调至 ${preferences.temperature}°C ${preferences.fan}`, "ac_set", {
          temperature: preferences.temperature,
          mode: "自动",
          fan: preferences.fan,
        }),
        planStep("purifier", "开启空气净化", "purifier_on", { mode: "自动" }),
        planStep("speaker", `播放${preferences.track}`, "speaker_play", {
          track: preferences.track,
          volume: preferences.volume,
        }),
        planStep(
          "vacuum",
          "安排客厅清扫",
          "vacuum_schedule",
          { schedule: cleaningSchedule },
          "confirm",
          `现在是晚上，暂不启动；建议${cleaningSchedule}`,
        ),
      ];
      return common;
    }

    if (intent === "Relax") {
      common.title = "放松模式";
      common.reason = `你刚刚表达了疲劳感，结合暖光、${preferences.temperature}°C ${preferences.fan}和${preferences.track}偏好，执行可撤销的环境调整。`;
      common.memories = [
        preferences.references.warm,
        preferences.references.ac,
        preferences.references.music,
      ];
      common.steps = [
        planStep("light", "客厅灯调为柔和暖光", "light_on", {
          brightness: 40,
          colorTemp: preferences.colorTemp,
        }),
        planStep("ac", `空调调至 ${preferences.temperature}°C ${preferences.fan}`, "ac_set", {
          temperature: preferences.temperature,
          mode: "自动",
          fan: preferences.fan,
        }),
        planStep("speaker", `低音量播放${preferences.track}`, "speaker_play", {
          track: preferences.track,
          volume: 20,
        }),
      ];
      return common;
    }

    if (intent === "Sleep") {
      common.title = "睡眠准备";
      common.reason = `根据你的 ${preferences.sleepTime} 睡眠习惯和${preferences.fan}偏好，关闭公共区域设备并准备卧室。`;
      common.memories = [
        preferences.references.sleep,
        preferences.references.wind,
        memoryReference("quiet-home", "安静环境"),
      ];
      common.steps = [
        planStep("light", "关闭客厅灯", "device_off"),
        planStep("speaker", "停止播放音乐", "device_off"),
        planStep("curtain", "关闭客厅窗帘", "curtain_set", { position: 0 }),
        planStep("bedroom-light", "卧室灯调至 20%", "light_on", { brightness: 20, colorTemp: 2800 }),
        planStep("bedroom-ac", `卧室空调设为 ${preferences.temperature}°C 睡眠模式`, "ac_set", {
          temperature: preferences.temperature,
          mode: "睡眠",
          fan: preferences.fan,
        }),
      ];
      return common;
    }

    if (intent === "Cleaning") {
      common.title = "客厅清扫安排";
      common.reason = isQuietHours(scenario.time)
        ? "当前属于夜间，立即清扫会产生噪音，建议延后到明天上午。"
        : "当前时间适合清扫，可以立即开始。";
      common.memories = [
        memoryReference("quiet-home", "夜间避免噪音"),
        preferences.references.cleaning,
      ];
      const isNight = isQuietHours(scenario.time);
      common.steps = [
        planStep(
          "vacuum",
          isNight ? `安排${cleaningSchedule}清扫` : "立即开始清扫",
          isNight ? "vacuum_schedule" : "vacuum_start",
          isNight ? { schedule: cleaningSchedule } : {},
          isNight ? "confirm" : "auto",
          isNight ? "等待你确认时间" : "低噪音模式",
        ),
      ];
      return common;
    }

    return common;
  }

  function parseDeviceCommand(text) {
    const temperature = text.match(/(1[6-9]|2[0-9]|30)\s*(?:度|°C|℃)?/i);
    const room = ["客厅", "卧室", "厨房", "卫生间", "阳台"].find((item) => text.includes(item)) || "客厅";
    const findDevice = (type) => state.devices.find((device) => device.room === room && device.type === type);
    if (/灯/.test(text)) {
      const device = findDevice("light");
      if (!device) return null;
      if (/(不要开|别开|关|关闭)/.test(text)) return planStep(device.id, `关闭${device.name}`, "device_off");
      const brightness = text.match(/(\d{1,3})\s*%/);
      const nextBrightness = brightness
        ? clamp(brightness[1], 1, 100)
        : /亮一点/.test(text)
          ? clamp((device.brightness || 60) + 10, 1, 100)
          : /暗一点/.test(text)
            ? clamp((device.brightness || 60) - 10, 1, 100)
            : device.brightness || 60;
      const nextColorTemp = /暖一点|更暖|黄一点/.test(text)
        ? clamp((device.colorTemp || 3500) - 300, 2700, 6500)
        : /冷一点|白一点/.test(text)
          ? clamp((device.colorTemp || 3500) + 300, 2700, 6500)
          : /(暖|黄)/.test(text)
            ? 3000
            : device.colorTemp || 4000;
      return planStep(device.id, `调整${device.name}`, "light_on", {
        brightness: nextBrightness,
        colorTemp: nextColorTemp,
      });
    }
    if (/空调|温度/.test(text)) {
      const device = findDevice("ac");
      if (!device) return null;
      if (/(不要开|别开|关|关闭)/.test(text)) return planStep(device.id, `关闭${device.name}`, "device_off");
      const targetTemperature = temperature
        ? Number(temperature[1])
        : /高一点|暖一点/.test(text)
          ? clamp((device.temperature || 26) + 1, 16, 30)
          : /低一点|凉一点/.test(text)
            ? clamp((device.temperature || 26) - 1, 16, 30)
            : device.temperature || 26;
      return planStep(device.id, `${device.name}调至 ${targetTemperature}°C`, "ac_set", {
        temperature: targetTemperature,
        mode: "自动",
        fan: /(强风|大风)/.test(text) ? "强风" : "弱风",
      });
    }
    if (/净化器/.test(text)) {
      const device = state.devices.find((item) => item.type === "purifier" && (!text.includes("卧室") || item.room === "卧室"));
      if (!device) return null;
      return planStep(device.id, /(关|关闭)/.test(text) ? `关闭${device.name}` : `开启${device.name}`, /(关|关闭)/.test(text) ? "device_off" : "purifier_on");
    }
    if (/音乐|音箱/.test(text)) {
      const device = state.devices.find((item) => item.type === "speaker" && item.room === room) || deviceById("speaker");
      if (!device) return null;
      return planStep(device.id, /(关|停止)/.test(text) ? "停止播放音乐" : "播放轻音乐", /(关|停止)/.test(text) ? "device_off" : "speaker_play", { track: "轻音乐", volume: 35 });
    }
    if (/窗帘/.test(text)) {
      const device = state.devices.find((item) => item.type === "curtain" && item.room === room) || deviceById("curtain");
      if (!device) return null;
      const percent = text.match(/(\d{1,3})\s*%/);
      const position = /(关|关闭)/.test(text) ? 0 : percent ? clamp(percent[1], 0, 100) : 100;
      return planStep(device.id, position === 0 ? "关闭窗帘" : "打开窗帘", "curtain_set", { position });
    }
    return null;
  }

  function createDeviceCommandPlan(text) {
    const step = parseDeviceCommand(text);
    if (!step) return null;
    return {
      id: uid("run"),
      intent: "Device_Command",
      title: "设备调整",
      createdAt: new Date().toISOString(),
      status: "planning",
      context: [state.scenario.time, "用户明确指令"],
      memories: ["不喜欢强风直吹"],
      reason: "根据你的指令调整单个设备。",
      source: "chat",
      steps: [step],
      summary: "",
    };
  }

  function automationStepForDevice(automation, device) {
    const preferences = agentPreferences();
    const isAway = automation.id === "away" || /离家/.test(automation.name);
    const isMorning = /晨起|早安/.test(automation.name);
    if (isAway) {
      if (device.type === "vacuum") return planStep(device.id, "离家后开始清扫", "vacuum_start");
      if (device.type === "curtain") {
        return planStep(device.id, "关闭窗帘", "curtain_set", { position: 0 });
      }
      return planStep(device.id, `关闭${device.name}`, "device_off");
    }
    if (isMorning) {
      if (device.type === "curtain") {
        return planStep(device.id, "拉开窗帘", "curtain_set", { position: 100 });
      }
      if (device.type === "speaker") {
        return planStep(device.id, "播放晨间音乐", "speaker_play", {
          track: "晨间音乐",
          volume: 30,
        });
      }
    }
    switch (device.type) {
      case "light":
        return planStep(device.id, `开启${device.name}`, "light_on", {
          brightness: device.brightness || preferences.brightness,
          colorTemp: device.colorTemp || preferences.colorTemp,
        });
      case "ac":
        return planStep(device.id, `${device.name}调至 ${preferences.temperature}°C`, "ac_set", {
          temperature: preferences.temperature,
          mode: "自动",
          fan: preferences.fan,
        });
      case "purifier":
        return planStep(device.id, `开启${device.name}`, "purifier_on", { mode: "自动" });
      case "vacuum":
        return planStep(device.id, "开始清扫", "vacuum_start");
      case "curtain":
        return planStep(device.id, "打开窗帘", "curtain_set", { position: 100 });
      case "speaker":
        return planStep(device.id, `播放${preferences.track}`, "speaker_play", {
          track: preferences.track,
          volume: preferences.volume,
        });
      default:
        return null;
    }
  }

  function createAutomationPlan(automation) {
    const steps = automation.actions
      .map((id) => deviceById(id))
      .filter(Boolean)
      .map((device) => automationStepForDevice(automation, device))
      .filter(Boolean);
    return {
      id: uid("run"),
      intent: "Automation",
      automationId: automation.id,
      title: automation.name,
      createdAt: new Date().toISOString(),
      status: "planning",
      context: [state.scenario.time, automation.trigger, "手动立即运行"],
      memories: [
        memoryReference("ac-preference", `${agentPreferences().temperature}°C`),
        memoryReference("quiet-home", "安静环境"),
      ],
      reason: `按照“${automation.name}”规则协调 ${steps.length} 个设备。`,
      source: "automation",
      steps,
      summary: "",
    };
  }

  async function runAutomationById(id) {
    const automation = state.automations.find((item) => item.id === id);
    if (!automation) return;
    if (!automation.enabled) {
      showToast("请先启用这条自动化");
      return;
    }
    let completed = true;
    if (automation.id === "home") {
      completed = await beginHomeRun(true);
    } else if (automation.id === "sleep") {
      completed = await beginSleepRun();
    } else if (automation.id === "scheduled-cleaning") {
      await confirmCleaning(automation.trigger);
    } else {
      const run = createAutomationPlan(automation);
      if (!run.steps.length) {
        showToast("这条自动化还没有可执行设备");
        return;
      }
      completed = await executePlan(run, { openSheet: true });
    }
    if (completed === false) return;
    automation.lastRun = "刚刚";
    persist();
    render();
  }

  async function executeDeviceCommand(step) {
    const device = deviceById(step.deviceId);
    if (!device) throw new Error("找不到设备");
    if (!device.online) throw new Error(`${device.name} 当前离线`);
    if (state.settings.simulateFailure && device.id === "ac") {
      state.settings.simulateFailure = false;
      persist();
      throw new Error("空调暂时离线，请检查连接");
    }
    const args = step.args || {};
    switch (step.command) {
      case "device_off":
        device.on = false;
        if (device.type === "vacuum") device.status = "待机";
        break;
      case "light_on":
        device.on = true;
        device.brightness = args.brightness ?? device.brightness ?? 60;
        device.colorTemp = args.colorTemp ?? device.colorTemp ?? 3000;
        break;
      case "ac_set":
        device.on = true;
        device.temperature = args.temperature ?? 26;
        device.mode = args.mode || "自动";
        device.fan = args.fan || "弱风";
        device.fanLevel = device.fan === "强风" ? 3 : device.fan === "中风" ? 2 : 1;
        break;
      case "purifier_on":
        device.on = true;
        device.mode = args.mode || "自动";
        break;
      case "speaker_play":
        device.on = true;
        device.track = args.track || "轻音乐";
        device.volume = args.volume ?? 35;
        break;
      case "curtain_set":
        device.position = clamp(args.position ?? 0, 0, 100);
        device.on = device.position > 0;
        break;
      case "vacuum_schedule":
        device.schedule = args.schedule || "明天 10:00";
        device.on = false;
        device.status = "已安排";
        break;
      case "vacuum_start":
        device.on = true;
        device.status = "清扫中";
        break;
      default:
        device.on = true;
    }
    return device;
  }

  function statusLabel(status) {
    return {
      pending: "待执行",
      running: "执行中",
      success: "已完成",
      failed: "失败",
      waiting: "待确认",
      skipped: "已跳过",
      interrupted: "已中断",
    }[status] || status;
  }

  function policyLabel(policy) {
    return { auto: "自动执行", confirm: "需要确认", defer: "延后执行" }[policy] || "";
  }

  function isStepSatisfied(step) {
    const device = deviceById(step.deviceId);
    if (!device || !device.online) return false;
    const args = step.args || {};
    switch (step.command) {
      case "device_off":
        return !device.on;
      case "light_on":
        return Boolean(
          device.on &&
            device.brightness === (args.brightness ?? device.brightness) &&
            device.colorTemp === (args.colorTemp ?? device.colorTemp),
        );
      case "ac_set":
        return Boolean(
          device.on &&
            device.temperature === (args.temperature ?? device.temperature) &&
            device.mode === (args.mode || device.mode) &&
            device.fan === (args.fan || device.fan),
        );
      case "purifier_on":
        return Boolean(device.on && device.mode === (args.mode || device.mode));
      case "speaker_play":
        return Boolean(
          device.on &&
            device.track === (args.track || device.track) &&
            device.volume === (args.volume ?? device.volume),
        );
      case "curtain_set":
        return device.position === clamp(args.position ?? 0, 0, 100);
      case "vacuum_schedule":
        return Boolean(device.schedule && device.schedule === (args.schedule || "明天 10:00") && !device.on);
      case "vacuum_start":
        return Boolean(device.on && device.status === "清扫中");
      default:
        return false;
    }
  }

  async function executePlan(run, options) {
    if (!run) return;
    if (runtime.activeRun && runtime.activeRun !== run.id) {
      showToast("已有任务正在执行，请稍候");
      return false;
    }
    const generation = runtime.generation;
    const config = { openSheet: false, announce: true, ...(options || {}) };
    state.agentRuns.push(run);
    runtime.activeRun = run.id;
    run.status = "running";
    if (config.openSheet) ui.sheet = { type: "run", id: run.id };
    state.chat.push({ id: uid("message"), from: "agent", kind: "run", runId: run.id, text: "" });
    persist();
    render();

    for (const step of run.steps) {
      if (step.policy === "confirm") continue;
      if (isStepSatisfied(step)) {
        step.status = "skipped";
        step.detail = `${deviceById(step.deviceId)?.name || "设备"}已处于目标状态`;
        persist();
        render();
        continue;
      }
      step.status = "running";
      persist();
      render();
      await wait(420);
      if (generation !== runtime.generation) return false;
      try {
        await executeDeviceCommand(step);
        syncHomeModeState();
        step.status = "success";
        step.detail = `${deviceById(step.deviceId)?.name || "设备"} · ${deviceSummary(
          deviceById(step.deviceId),
        )}`;
      } catch (error) {
        step.status = "failed";
        step.detail = error.message || "执行失败";
      }
      persist();
      render();
      await wait(180);
      if (generation !== runtime.generation) return false;
    }

    const hasWaiting = run.steps.some((step) => step.status === "waiting");
    const waitingStep = run.steps.find((step) => step.status === "waiting");
    const waitingSchedule = waitingStep?.args?.schedule || `明天 ${agentPreferences().cleaningTime}`;
    const failed = run.steps.filter((step) => step.status === "failed");
    run.status = failed.length ? "partial" : hasWaiting ? "waiting_confirmation" : "success";
    const successNames = run.steps
      .filter((step) => step.status === "success" || step.status === "skipped")
      .map((step) => step.label);
    run.summary = failed.length
      ? `${successNames.join("、")}已完成；${failed.map((step) => step.label).join("、")}执行失败，可重试。`
      : hasWaiting
        ? `${successNames.join("、")}已完成；清扫因夜间噪音暂缓，等待你确认${waitingSchedule}。`
        : successNames.length
          ? `${successNames.join("、")}已完成。`
          : "设备已处于目标状态，无需重复调整。";

    if (run.intent === "Home_Return") {
      state.demo.homeModeActive = homeTargetsSatisfied();
      state.demo.pendingCleaning = hasWaiting ? { runId: run.id, schedule: waitingSchedule } : null;
      state.demo.lastSummary = failed.length || !state.demo.homeModeActive
        ? "大部分环境已经准备完成，但有一个设备需要重试。"
        : "今晚环境已经准备完成，清扫任务等待你的确认。";
      const automation = state.automations.find((item) => item.id === "home");
      if (automation) automation.lastRun = "刚刚";
      addRecentMemory("今晚开启回家模式", run.summary, "home");
    }
    if (run.intent === "Relax") {
      addRecentMemory("刚刚开启放松模式", run.summary, "speaker");
    }
    if (run.intent === "Sleep") {
      const automation = state.automations.find((item) => item.id === "sleep");
      if (automation) automation.lastRun = "刚刚";
      addRecentMemory("刚刚完成睡眠准备", run.summary, "moon");
    }
    if (run.intent === "Device_Command") {
      addRecentMemory("刚刚调整了一个设备", run.summary, "devices");
    }
    if (runtime.activeRun === run.id) runtime.activeRun = null;
    persist();
    render();
    if (config.announce) showToast(failed.length ? "部分任务需要重试" : "Agent 执行完成");
    return true;
  }

  async function beginHomeRun(openSheet) {
    if (runtime.activeRun) {
      showToast("已有任务正在执行");
      return false;
    }
    if (homeTargetsSatisfied()) {
      const lastRun = [...state.agentRuns].reverse().find((item) => item.intent === "Home_Return");
      if (openSheet && lastRun) {
        ui.sheet = { type: "run", id: lastRun.id };
        render();
      } else if (state.page === "chat") {
        addChat("agent", "回家模式已经按你的偏好完成，无需重复执行。你可以随时修改单个设备。" );
      }
      showToast("回家模式已处于目标状态");
      return true;
    }
    const run = createPlan("Home_Return", { source: state.page === "home" ? "home" : "chat" });
    return executePlan(run, { openSheet: Boolean(openSheet) });
  }

  async function beginRelaxRun() {
    if (runtime.activeRun) {
      showToast("已有任务正在执行");
      return false;
    }
    const run = createPlan("Relax", { source: "chat" });
    return executePlan(run, { openSheet: false });
  }

  async function beginSleepRun() {
    const run = createPlan("Sleep", { source: "chat" });
    return executePlan(run, { openSheet: false });
  }

  async function beginDevicePlan(text) {
    const run = createDeviceCommandPlan(text);
    if (!run) {
      addChat("agent", "我还没有识别出要调整的设备。你可以说“客厅灯暖一点”或“空调调到 25 度”。");
      return false;
    }
    return executePlan(run, { openSheet: false });
  }

  function parseAgentAnswer(answer) {
    const cleaned = String(answer || "")
      .replace(/<think>[\s\S]*?<\/think>/gi, "")
      .replace(/^```(?:json)?\s*/i, "")
      .replace(/\s*```$/, "")
      .trim();
    try {
      return JSON.parse(cleaned);
    } catch {
      const start = cleaned.indexOf("{");
      const end = cleaned.lastIndexOf("}");
      if (start >= 0 && end > start) return JSON.parse(cleaned.slice(start, end + 1));
      throw new Error("Agent 返回的不是有效 JSON");
    }
  }

  async function requestDifyAgent(message) {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        conversation_id: runtime.difyConversationId,
        user: "home-agent-demo-user",
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Agent 请求失败");
    runtime.difyConversationId = data.conversation_id || runtime.difyConversationId;
    return parseAgentAnswer(data.answer);
  }

  function applyAgentActions(actions) {
    const applied = [];
    for (const action of Array.isArray(actions) ? actions : []) {
      const args = action.arguments || {};
      let device = null;
      if (action.entity_id === "light.living_room") device = deviceById("light");
      if (action.entity_id === "climate.living_room") device = deviceById("ac");
      if (action.entity_id === "purifier.living_room") device = deviceById("purifier");
      if (action.entity_id === "vacuum.living_room") device = deviceById("vacuum");
      if (action.entity_id === "curtain.living_room") device = deviceById("curtain");
      if (action.entity_id === "speaker.living_room") device = deviceById("speaker");
      if (!device || !device.online) continue;

      if (action.tool === "set_light") {
        device.on = args.state !== "off";
        device.brightness = clamp(args.brightness ?? device.brightness, 1, 100);
        device.colorTemp = clamp(args.color_temp_kelvin ?? device.colorTemp, 2700, 6500);
      } else if (action.tool === "set_climate") {
        device.on = args.state !== "off";
        device.temperature = clamp(args.temperature ?? device.temperature, 16, 30);
        device.mode = args.mode || device.mode || "自动";
        device.fan = args.fan === "low" ? "弱风" : args.fan === "medium" ? "中风" : args.fan === "high" ? "强风" : args.fan || device.fan;
      } else if (action.tool === "set_purifier") {
        device.on = args.state !== "off";
        device.mode = args.mode || "自动";
      } else if (action.tool === "start_vacuum") {
        device.on = true;
        device.status = "清扫中";
      } else if (action.tool === "schedule_vacuum") {
        device.on = false;
        device.status = "已安排";
        device.schedule = args.time || "明天 10:00";
      } else if (action.tool === "set_curtain") {
        device.position = clamp(args.position ?? 0, 0, 100);
        device.on = device.position > 0;
      } else if (action.tool === "play_music") {
        device.on = true;
        device.track = args.track || "轻音乐";
        device.volume = clamp(args.volume ?? 35, 0, 100);
      } else if (action.tool === "stop_music") {
        device.on = false;
      } else {
        continue;
      }
      applied.push(device.name);
    }
    syncHomeModeState();
    persist();
    render();
    return [...new Set(applied)];
  }

  function handleDifyResult(result) {
    if (result.intent === "MEMORY_ADD" && result.memory_candidate) {
      const content = typeof result.memory_candidate === "string"
        ? result.memory_candidate
        : result.memory_candidate.content || result.memory_candidate.value || JSON.stringify(result.memory_candidate);
      state.memories.push({
        id: uid("memory"), kind: "preference", title: content, detail: "来自 Agent 对话",
        value: content, source: "用户明确表达", confidence: 100, icon: "sparkles",
      });
      persist();
    }
    const actions = Array.isArray(result.actions) ? result.actions : [];
    if (result.requires_confirmation) {
      state.demo.pendingAgentPlan = { actions, reply: result.reply || "需要你的确认。" };
      persist();
      addChat("agent", result.reply || "这个操作需要你的确认。", {
        actions: [
          { label: "确认执行", action: "confirm-agent-plan" },
          { label: "取消", action: "decline-action", secondary: true },
        ],
      });
      return;
    }
    addChat("agent", result.reply || "计划已经生成。" );
    const applied = applyAgentActions(actions);
    if (applied.length) showToast(`已同步：${applied.join("、")}`);
  }

  async function handleChat(text) {
    const value = text.trim();
    if (!value) return;
    addChat("me", value);
    ui.typing = true;
    render();
    try {
      const agentResult = await requestDifyAgent(value);
      ui.typing = false;
      handleDifyResult(agentResult);
      return;
    } catch (error) {
      console.warn("Dify Agent unavailable, using local fallback:", error.message);
    }
    await wait(420);
    const result = classifyIntent(value);
    ui.typing = false;

    if (state.demo.pendingCleaning && /^(好|好的|可以|行|确认|安排吧|执行吧)[！!。.]?$/.test(value)) {
      await confirmCleaning(state.demo.pendingCleaning.schedule);
      return;
    }
    if (state.demo.pendingCleaning && /^(不用|不要|取消|算了|不需要)[！!。.]?$/.test(value)) {
      const pendingRun = state.agentRuns.find((run) => run.id === state.demo.pendingCleaning.runId);
      if (pendingRun) {
        pendingRun.steps
          .filter((step) => step.status === "waiting")
          .forEach((step) => {
            step.status = "skipped";
            step.detail = "用户本次未安排";
          });
        pendingRun.status = "cancelled";
        pendingRun.summary = "本次未安排清扫。";
      }
      state.demo.pendingCleaning = null;
      persist();
      addChat("agent", "好的，本次不安排清扫。扫地机器人会继续待机。" );
      return;
    }
    if (state.demo.pendingCleaning && /^(改到|改成|换到|换个时间)/.test(value)) {
      ui.sheet = { type: "cleaning-time" };
      render();
      return;
    }

    if (result.intent === "Memory_Add") {
      const content = value.replace(/^(记住|请记住|以后记得)[，,:：\s]*/, "").trim();
      if (!content) {
        addChat("agent", "你希望我记住什么？例如：记住我喜欢 25°C 弱风。");
        return;
      }
      state.memories.push({
        id: uid("memory"),
        kind: "preference",
        title: content,
        detail: "来自刚刚的对话",
        value: content,
        source: "用户明确表达",
        confidence: 100,
        icon: "sparkles",
      });
      persist();
      addChat("agent", `记住了：“${content}”。以后制定计划时我会参考这条偏好。`);
      return;
    }

    if (result.intent === "Home_Return") {
      if (homeTargetsSatisfied()) {
        await beginHomeRun(false);
        return;
      }
      const homeAutomation = state.automations.find((item) => item.id === "home");
      if (!state.settings.autoExecuteSafe || homeAutomation?.enabled === false) {
        addChat(
          "agent",
          homeAutomation?.enabled === false
            ? "回家自动化目前已关闭。我已经准备好回家计划，需要临时执行一次吗？"
            : "自动执行低风险操作目前已关闭。我已经准备好回家计划，需要现在执行吗？",
          {
            actions: [
              { label: "执行一次", action: "start-home-run" },
              { label: "暂不执行", action: "decline-action", secondary: true },
            ],
          },
        );
        return;
      }
      const run = createPlan("Home_Return", { source: "chat" });
      addChat("agent", "欢迎回家。我已读取当前环境和你的习惯，正在生成回家模式计划。", {
        actions: [{ label: "查看计划", action: "open-run", id: run.id }],
      });
      await executePlan(run, { openSheet: false });
      return;
    }

    if (result.intent === "Relax") {
      const preferences = agentPreferences();
      addChat("agent", `检测到你需要休息。我会使用暖光、${preferences.temperature}°C ${preferences.fan}和${preferences.track}；这些都是低风险操作，需要现在开启吗？`, {
        actions: [
          { label: "开启", action: "confirm-relax" },
          { label: "不用了", action: "decline-action", secondary: true },
        ],
      });
      return;
    }

    if (result.intent === "Sleep") {
      const preferences = agentPreferences();
      if (!state.settings.autoExecuteSafe) {
        addChat("agent", "睡眠环境计划已准备好。自动执行目前已关闭，需要现在执行吗？", {
          actions: [
            { label: "执行睡眠准备", action: "confirm-sleep" },
            { label: "暂不执行", action: "decline-action", secondary: true },
          ],
        });
        return;
      }
      addChat("agent", `好的。我会关闭客厅灯和音乐、合上窗帘，并把卧室调整为 ${preferences.temperature}°C 睡眠模式。正在执行。` );
      await beginSleepRun();
      return;
    }

    if (result.intent === "Cleaning") {
      const vacuum = deviceById("vacuum");
      if (vacuum?.schedule && !state.demo.pendingCleaning) {
        addChat("agent", `清扫已经安排在${vacuum.schedule}，我不会重复创建任务。需要时可以修改时间。`, {
          actions: [{ label: "修改时间", action: "reschedule-cleaning", secondary: true }],
        });
        return;
      }
      const run = createPlan("Cleaning", { source: "chat" });
      if (!isQuietHours(state.scenario.time)) {
        addChat("agent", `现在是 ${state.scenario.time}，适合进行清扫。我会使用低噪音模式立即开始。`);
        await executePlan(run, { openSheet: false });
        return;
      }
      state.agentRuns.push(run);
      state.chat.push({ id: uid("message"), from: "agent", kind: "run", runId: run.id, text: "" });
      const schedule = run.steps[0]?.args?.schedule || `明天 ${agentPreferences().cleaningTime}`;
      state.demo.pendingCleaning = { runId: run.id, schedule };
      persist();
      render();
      addChat("agent", `现在是 ${state.scenario.time}，扫地机器人会产生噪音。我建议${schedule}清扫，可以吗？`, {
        actions: [
          { label: "确认安排", action: "confirm-cleaning", value: schedule },
          { label: "换个时间", action: "reschedule-cleaning", secondary: true },
        ],
      });
      return;
    }

    if (result.intent === "Device_Command") {
      if (!state.settings.autoExecuteSafe) {
        addChat("agent", "已理解设备调整要求。自动执行目前已关闭，需要现在执行吗？", {
          actions: [
            { label: "确认执行", action: "confirm-device-command", value },
            { label: "取消", action: "decline-action", secondary: true },
          ],
        });
        return;
      }
      addChat("agent", "已理解设备调整要求，我会按你的指令执行并同步状态。" );
      await beginDevicePlan(value);
      return;
    }

    addChat("agent", "我可以帮你准备回家、睡眠和清扫场景，也可以直接调整灯光、空调、窗帘、净化器和音箱。" );
  }

  function queueChat(text) {
    runtime.agentQueue = runtime.agentQueue.then(() => handleChat(text));
    return runtime.agentQueue;
  }

  async function confirmCleaning(schedule) {
    if (runtime.activeRun) {
      showToast("请等待当前任务完成后再安排清扫");
      return false;
    }
    const generation = runtime.generation;
    const requestedSchedule = schedule || `明天 ${agentPreferences().cleaningTime}`;
    const vacuum = deviceById("vacuum");
    const pending = state.demo.pendingCleaning;
    if (!pending && vacuum?.schedule === requestedSchedule) {
      addChat("agent", `清扫已经安排在${requestedSchedule}，无需重复创建。`);
      ui.sheet = null;
      showToast("清扫计划没有变化");
      return;
    }
    let run = pending ? state.agentRuns.find((item) => item.id === pending.runId) : null;
    if (!run) {
      run = createPlan("Cleaning", { source: "chat" });
      state.agentRuns.push(run);
    }
    let step = run.steps.find((item) => item.command === "vacuum_schedule");
    if (!step) {
      step = planStep("vacuum", `安排${requestedSchedule}清扫`, "vacuum_schedule", {
        schedule: requestedSchedule,
      });
      run.steps = [step];
    }
    step.label = `安排${requestedSchedule}清扫`;
    step.command = "vacuum_schedule";
    step.policy = "auto";
    step.args = { schedule: requestedSchedule };
    step.status = "running";
    run.status = "running";
    runtime.activeRun = run.id;
    persist();
    render();
    await wait(380);
    if (generation !== runtime.generation) return false;
    let succeeded = false;
    try {
      await executeDeviceCommand(step);
      step.status = "success";
      step.detail = `扫地机器人 · ${requestedSchedule}`;
      run.status = "success";
      run.summary = `清扫已安排在${requestedSchedule}。`;
      state.demo.pendingCleaning = null;
      state.chat.forEach((message) => {
        if (!Array.isArray(message.actions)) return;
        message.actions = message.actions.filter(
          (action) => !["confirm-cleaning", "reschedule-cleaning"].includes(action.action),
        );
      });
      if (state.demo.homeModeActive) {
        state.demo.lastSummary = `今晚环境已经准备完成，清扫已安排在${requestedSchedule}。`;
      }
      const existing = state.automations.find((item) => item.id === "scheduled-cleaning");
      if (existing) {
        existing.trigger = requestedSchedule;
        existing.enabled = true;
      } else {
        state.automations.push({
          id: "scheduled-cleaning",
          name: "预约清扫",
          trigger: requestedSchedule,
          enabled: true,
          actions: ["vacuum"],
          lastRun: "等待执行",
          custom: true,
        });
      }
      addRecentMemory("已安排客厅清扫", requestedSchedule, "vacuum");
      addChat("agent", `已安排${requestedSchedule}清扫。今晚保持安静，任务执行前我会再次提醒你。`);
      succeeded = true;
    } catch (error) {
      step.status = "failed";
      step.detail = error.message;
      run.status = "partial";
    }
    if (runtime.activeRun === run.id) runtime.activeRun = null;
    ui.sheet = null;
    persist();
    render();
    showToast(succeeded ? "清扫任务已安排" : "清扫安排失败，请重试");
    return succeeded;
  }

  function genericDeviceDefaults(type) {
    const base = { online: true, on: false, favorite: false, timer: "", timerCommand: "off" };
    if (type === "light") return { ...base, brightness: 60, colorTemp: 3000 };
    if (type === "ac") return { ...base, temperature: 26, mode: "自动", fan: "弱风", fanLevel: 1 };
    if (type === "purifier") return { ...base, mode: "自动", fanLevel: 2 };
    if (type === "vacuum") return { ...base, status: "待机", battery: 100, schedule: "" };
    if (type === "curtain") return { ...base, position: 0 };
    return { ...base, volume: 35, track: "轻音乐" };
  }

  function applyDueDeviceTimers() {
    let count = 0;
    state.devices.forEach((device) => {
      if (!device.online || !device.timer || device.timer !== state.scenario.time) return;
      device.on = device.timerCommand === "on";
      if (device.type === "vacuum") device.status = device.on ? "清扫中" : "待机";
      if (device.type === "curtain") device.position = device.on ? 100 : 0;
      count += 1;
    });
    if (count) syncHomeModeState();
    return count;
  }

  function updateSliderOutput(input) {
    const field = input.dataset.deviceField;
    const output = root.querySelector(`[data-output-for="${field}"]`);
    const device = deviceById(input.dataset.id);
    if (!output || !device) return;
    const value = Number(input.value);
    if (field === "brightness" || field === "position" || field === "volume") {
      output.textContent = `${value}%`;
    } else if (field === "colorTemp") {
      output.textContent = `${value}K ${value <= 3200 ? "暖白色" : "自然光"}`;
    } else if (field === "temperature") {
      output.textContent = `${value}°C`;
    } else if (field === "fanLevel") {
      output.textContent = `${value} 档`;
    }
  }

  function handleClick(event) {
    const target = event.target.closest("[data-action]");
    if (!target || !root.contains(target)) return;
    const action = target.dataset.action;
    const id = target.dataset.id;
    const value = target.dataset.value;
    const consumeMessageActions = () => {
      const messageId = target.dataset.messageId;
      if (!messageId) return;
      const message = state.chat.find((item) => item.id === messageId);
      if (message) message.actions = [];
      persist();
    };

    if (action === "close-sheet") {
      if (event.target.closest("[data-sheet-panel]") && target.classList.contains("ha-sheet-backdrop")) return;
      ui.sheet = null;
      render();
      return;
    }

    if (action === "nav") {
      state.page = value || (target.textContent.includes("查看全部") ? "devices" : "home");
      ui.selectedDevice = null;
      ui.sheet = null;
      persist();
      render();
      return;
    }

    if (action === "open-notifications") {
      ui.sheet = { type: "notifications" };
      render();
      return;
    }
    if (action === "mark-notifications-read") {
      state.notifications.forEach((item) => (item.read = true));
      persist();
      ui.sheet = null;
      showToast("通知已全部标为已读");
      return;
    }
    if (action === "start-home-run") {
      consumeMessageActions();
      ui.sheet = null;
      beginHomeRun(true);
      return;
    }
    if (action === "confirm-relax") {
      consumeMessageActions();
      ui.sheet = null;
      beginRelaxRun();
      return;
    }
    if (action === "confirm-sleep") {
      consumeMessageActions();
      ui.sheet = null;
      beginSleepRun();
      return;
    }
    if (action === "confirm-device-command") {
      consumeMessageActions();
      ui.sheet = null;
      beginDevicePlan(value || "");
      return;
    }
    if (action === "confirm-agent-plan") {
      consumeMessageActions();
      const pending = state.demo.pendingAgentPlan;
      state.demo.pendingAgentPlan = null;
      if (pending) {
        const applied = applyAgentActions(pending.actions);
        addChat("agent", applied.length ? `已执行并同步：${applied.join("、")}。` : "已确认，本次没有需要执行的设备动作。" );
      }
      return;
    }
    if (action === "decline-action") {
      consumeMessageActions();
      state.demo.pendingAgentPlan = null;
      persist();
      addChat("agent", "好的，我不会调整设备。需要时随时告诉我。" );
      return;
    }
    if (action === "open-run") {
      ui.sheet = { type: "run", id };
      render();
      return;
    }
    if (action === "open-latest-run") {
      const run = state.agentRuns[state.agentRuns.length - 1];
      if (run) ui.sheet = { type: "run", id: run.id };
      render();
      return;
    }
    if (action === "retry-run") {
      const run = state.agentRuns.find((item) => item.id === id);
      if (run) {
        const failedSteps = run.steps
          .filter((step) => step.status === "failed")
          .map((step) => ({ ...step, id: uid("step"), status: "pending", detail: "" }));
        if (failedSteps.length) {
          executePlan(
            {
              ...run,
              id: uid("run"),
              title: `${run.title} · 重试`,
              status: "planning",
              steps: failedSteps,
              summary: "",
            },
            { openSheet: true },
          );
        }
      }
      return;
    }
    if (action === "chat-suggestion") {
      queueChat(value || target.textContent.trim());
      return;
    }
    if (action === "confirm-cleaning") {
      consumeMessageActions();
      confirmCleaning(value || state.demo.pendingCleaning?.schedule || `明天 ${agentPreferences().cleaningTime}`);
      return;
    }
    if (action === "reschedule-cleaning") {
      ui.sheet = { type: "cleaning-time" };
      render();
      return;
    }
    if (action === "open-agent-info") {
      ui.sheet = { type: "agent-info" };
      render();
      return;
    }
    if (action === "memory-tab") {
      ui.memoryTab = value;
      render();
      return;
    }
    if (action === "open-memory") {
      ui.sheet = state.memories.some((item) => item.id === id)
        ? { type: "memory", id }
        : { type: "memory-recent", id };
      render();
      return;
    }
    if (action === "add-memory") {
      ui.sheet = { type: "memory-add" };
      render();
      return;
    }
    if (action === "delete-memory") {
      state.memories = state.memories.filter((item) => item.id !== id);
      ui.sheet = null;
      persist();
      showToast("记忆已删除");
      return;
    }
    if (action === "automation-tab") {
      ui.automationTab = value;
      render();
      return;
    }
    if (action === "toggle-automation") {
      const automation = state.automations.find((item) => item.id === id);
      if (automation) {
        automation.enabled = !automation.enabled;
        persist();
        render();
        showToast(`${automation.name}${automation.enabled ? "已开启" : "已关闭"}`);
      }
      return;
    }
    if (action === "create-automation") {
      ui.sheet = { type: "automation-create" };
      render();
      return;
    }
    if (action === "automation-detail") {
      if (ui.automationTab === "mine") {
        ui.sheet = { type: "automation", id };
        render();
      }
      return;
    }
    if (action === "add-recommended") {
      const recommendation = state.recommendations.find((item) => item.id === id);
      if (recommendation) {
        state.automations.push({
          ...recommendation,
          id: uid("automation"),
          enabled: true,
          lastRun: "",
          custom: true,
        });
        state.recommendations = state.recommendations.filter((item) => item.id !== id);
        persist();
        showToast("已添加到我的自动化");
      }
      return;
    }
    if (action === "delete-automation") {
      state.automations = state.automations.filter((item) => item.id !== id);
      ui.sheet = null;
      persist();
      showToast("自动化已删除");
      return;
    }
    if (action === "run-automation") {
      ui.sheet = null;
      runAutomationById(id);
      return;
    }
    if (action === "room-tab") {
      ui.selectedRoom = value;
      render();
      return;
    }
    if (action === "open-device") {
      state.page = "devices";
      ui.selectedDevice = id;
      persist();
      render();
      return;
    }
    if (action === "back-devices") {
      ui.selectedDevice = null;
      render();
      return;
    }
    if (action === "toggle-device") {
      const device = deviceById(id);
      if (!device) return;
      if (!device.online) {
        showToast(`${device.name} 当前离线`);
        return;
      }
      device.on = !device.on;
      if (device.type === "vacuum") device.status = device.on ? "清扫中" : "待机";
      if (device.type === "curtain") device.position = device.on ? 100 : 0;
      syncHomeModeState();
      persist();
      render();
      showToast(`${device.name}${device.on ? "已开启" : "已关闭"}`);
      return;
    }
    if (action === "favorite-device") {
      const device = deviceById(id);
      if (device) {
        device.favorite = !device.favorite;
        persist();
        render();
        showToast(device.favorite ? "已加入收藏" : "已取消收藏");
      }
      return;
    }
    if (action === "device-timer") {
      ui.sheet = { type: "device-timer", id };
      render();
      return;
    }
    if (action === "device-more") {
      ui.sheet = { type: "device-more", id };
      render();
      return;
    }
    if (action === "add-device") {
      ui.sheet = { type: "device-add" };
      render();
      return;
    }
    if (action === "toggle-online") {
      const device = deviceById(id);
      if (device) {
        device.online = !device.online;
        if (!device.online) device.on = false;
        syncHomeModeState();
        ui.sheet = null;
        persist();
        render();
        showToast(`${device.name}${device.online ? "已连接" : "已断开"}`);
      }
      return;
    }
    if (action === "remove-device") {
      state.devices = state.devices.filter((device) => device.id !== id);
      syncHomeModeState();
      ui.selectedDevice = null;
      ui.sheet = null;
      persist();
      showToast("设备已移除");
      return;
    }
    if (action === "speaker-track") {
      ui.sheet = { type: "speaker-track", id: ui.selectedDevice };
      render();
      return;
    }
    if (action === "select-track") {
      const device = deviceById(id);
      if (device) {
        if (value === "停止播放") {
          device.on = false;
        } else {
          device.on = true;
          device.track = value;
        }
        syncHomeModeState();
        ui.sheet = null;
        persist();
        render();
        showToast(value === "停止播放" ? "音乐已停止" : `正在播放${value}`);
      }
      return;
    }
    if (action === "open-family") ui.sheet = { type: "family" };
    if (action === "open-help") ui.sheet = { type: "help" };
    if (action === "open-settings") ui.sheet = { type: "settings" };
    if (action === "open-about") ui.sheet = { type: "about" };
    if (action === "logout") ui.sheet = { type: "logout" };
    if (["open-family", "open-help", "open-settings", "open-about", "logout"].includes(action)) {
      render();
      return;
    }
    if (action === "toggle-setting") {
      state.settings[value] = !state.settings[value];
      persist();
      render();
      return;
    }
    if (action === "open-scenario") {
      ui.sheet = { type: "scenario" };
      render();
      return;
    }
    if (action === "confirm-reset") {
      ui.sheet = { type: "reset" };
      render();
      return;
    }
    if (action === "reset-demo") {
      resetState();
      return;
    }
    if (action === "confirm-logout") {
      ui.sheet = null;
      state.page = "home";
      render();
      showToast("已退出演示账号");
      return;
    }
    if (action === "invite-family") {
      showToast("邀请链接已复制（演示）");
      return;
    }
    if (action === "send-feedback") {
      showToast("感谢反馈（本地演示）");
    }
  }

  function handleSubmit(event) {
    const form = event.target.closest("form[data-form]");
    if (!form || !root.contains(form)) return;
    event.preventDefault();
    const data = new FormData(form);
    const type = form.dataset.form;

    if (type === "chat") {
      const message = String(data.get("message") || "").trim();
      form.reset();
      queueChat(message);
      return;
    }
    if (type === "memory") {
      const title = String(data.get("title") || "").trim();
      const value = String(data.get("value") || "").trim();
      if (!title || !value) {
        showToast("请填写完整的记忆内容");
        return;
      }
      const item = state.memories.find((memory) => memory.id === data.get("id"));
      if (item) {
        item.title = title;
        item.value = value;
        item.detail = "刚刚由你修正";
        item.source = "用户主动修正";
        item.confidence = 100;
      }
      ui.sheet = null;
      persist();
      showToast("记忆已更新");
      return;
    }
    if (type === "memory-add") {
      const title = String(data.get("title") || "").trim();
      const value = String(data.get("value") || "").trim();
      if (!title || !value) {
        showToast("请填写完整的记忆内容");
        return;
      }
      state.memories.push({
        id: uid("memory"),
        kind: String(data.get("kind") || "preference"),
        title,
        detail: "刚刚添加",
        value,
        source: "用户主动添加",
        confidence: 100,
        icon: "sparkles",
      });
      ui.sheet = null;
      persist();
      showToast("新记忆已保存");
      return;
    }
    if (type === "automation-create") {
      const actions = data.getAll("actions").map(String);
      const name = String(data.get("name") || "").trim();
      if (!name) {
        showToast("请填写自动化名称");
        return;
      }
      if (!actions.length) {
        showToast("请至少选择一个执行设备");
        return;
      }
      state.automations.push({
        id: uid("automation"),
        name,
        trigger: String(data.get("trigger") || "手动触发"),
        enabled: true,
        actions,
        lastRun: "",
        custom: true,
      });
      ui.sheet = null;
      ui.automationTab = "mine";
      persist();
      showToast("自动化已创建");
      return;
    }
    if (type === "device-add") {
      const deviceType = String(data.get("type") || "light");
      const name = String(data.get("name") || "").trim();
      if (!name) {
        showToast("请填写设备名称");
        return;
      }
      const device = {
        id: `custom-${uid("device")}`,
        name,
        room: String(data.get("room") || "客厅"),
        type: deviceType,
        ...genericDeviceDefaults(deviceType),
      };
      state.devices.push(device);
      ui.selectedRoom = device.room;
      ui.sheet = null;
      persist();
      showToast("设备已添加");
      return;
    }
    if (type === "device-timer") {
      const device = deviceById(String(data.get("id") || ""));
      if (device) {
        device.timer = String(data.get("time") || "");
        device.timerCommand = String(data.get("command") || "off");
      }
      ui.sheet = null;
      persist();
      showToast("设备定时已保存");
      return;
    }
    if (type === "cleaning-time") {
      confirmCleaning(`${String(data.get("day") || "明天")} ${String(data.get("time") || "10:00")}`);
      return;
    }
    if (type === "scenario") {
      state.scenario.time = String(data.get("time") || "20:00");
      state.scenario.outsideTemp = Number(data.get("outsideTemp") || 18);
      state.scenario.feelsLike = state.scenario.outsideTemp - 2;
      state.scenario.pm25 = Number(data.get("pm25") || 68);
      state.scenario.userStatus = String(data.get("userStatus") || "在家");
      const timersRun = applyDueDeviceTimers();
      ui.sheet = null;
      persist();
      showToast(timersRun ? `场景已更新，${timersRun} 个设备定时已执行` : "场景数据已更新");
    }
  }

  function handleInput(event) {
    const input = event.target.closest("[data-device-field]");
    if (!input) return;
    const device = deviceById(input.dataset.id);
    if (!device) return;
    if (!device.online) {
      showToast(`${device.name} 当前离线`);
      render();
      return;
    }
    const field = input.dataset.deviceField;
    const value = Number(input.value);
    device[field] = value;
    if (field === "brightness" || field === "volume" || field === "position") {
      device.on = value > 0;
    }
    if (field === "fanLevel") {
      device.fan = value === 1 ? "弱风" : value === 2 ? "中风" : "强风";
    }
    syncHomeModeState();
    updateSliderOutput(input);
    persist();
  }

  function handleChange(event) {
    if (event.target.matches("[data-device-field]")) render();

  function handleKeydown(event) {
    if (event.key === "Escape" && ui.sheet) {
      event.preventDefault();
      ui.sheet = null;
      render();
      return;

    if (event.key === "Enter" && !event.shiftKey && event.target?.id === "ha-chat-input") {
      event.preventDefault();
      const message = event.target.value.trim();
      if (!message) return;
      event.target.value = "";
      queueChat(message);
      return;
    }
    if ((event.key === "Enter" || event.key === " ") && event.target?.matches?.('[tabindex="0"][data-action]')) {
      event.preventDefault();
      event.target.click();
      return;
    }
    if ((event.key === "ArrowLeft" || event.key === "ArrowRight") && event.target?.getAttribute?.("role") === "tab") {
      const tabs = [...event.target.parentElement.querySelectorAll('[role="tab"]')];
      const index = tabs.indexOf(event.target);
      if (index >= 0) {
        event.preventDefault();
        const offset = event.key === "ArrowRight" ? 1 : -1;
        const next = tabs[(index + offset + tabs.length) % tabs.length];
        next.focus();
        next.click();
      }
    }
  }

<script>
  (function () {
    var STORAGE_ORDER = "haEditOrderV1";
    var STORAGE_CONTENT = "haEditContentV1";
    var MODULE_CONTAINER_SELECTOR = "main.screen, .ha-sheet-body";

    function loadJSON(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "{}");
      } catch (e) {
        return {};
      }
    }
    function saveJSON(key, obj) {
      try {
        localStorage.setItem(key, JSON.stringify(obj));
      } catch (e) {}
    }

    var orderStore = loadJSON(STORAGE_ORDER);
    var contentStore = loadJSON(STORAGE_CONTENT);
    var editMode = false;

    function pageKeyFor(root) {
      var navBtn = root.querySelector(".bottom-nav button.active[data-value]");
      if (navBtn) return "page:" + navBtn.dataset.value;
      var h1 = root.querySelector("main h1, .ha-sheet header b");
      return "page:detail:" + (h1 ? h1.textContent.trim() : "unknown");
    }

    function containerKeyFor(el) {
      if (el.matches("main.screen")) return "main";
      var panel = el.closest("[data-sheet-panel]");
      if (panel) {
        var label = panel.getAttribute("aria-label") || "sheet";
        return "sheet:" + label;
      }
      return "container";
    }

    function collectLeaves(moduleEl) {
      var leaves = [];
      var walker = document.createTreeWalker(moduleEl, NodeFilter.SHOW_ELEMENT, null);
      var node;
      while ((node = walker.nextNode())) {
        if (
          node.children.length === 0 &&
          node.textContent &&
          node.textContent.trim().length > 0 &&
          !node.hasAttribute("data-ha-edit-handle")
        ) {
          leaves.push(node);
        }
      }
      return leaves;
    }

    function applyOrder(containerEl, storeKey) {
      var children = Array.prototype.slice.call(containerEl.children);
      children.forEach(function (child, idx) {
        child.setAttribute("data-ha-edit-module", String(idx));
      });
      var savedOrder = orderStore[storeKey];
      if (savedOrder && savedOrder.length) {
        var byIdx = {};
        children.forEach(function (c) {
          byIdx[c.getAttribute("data-ha-edit-module")] = c;
        });
        var used = {};
        savedOrder.forEach(function (idxStr) {
          var el = byIdx[idxStr];
          if (el) {
            containerEl.appendChild(el);
            used[idxStr] = true;
          }
        });
        children.forEach(function (c) {
          var idxStr = c.getAttribute("data-ha-edit-module");
          if (!used[idxStr]) containerEl.appendChild(c);
        });
      }
    }

    function applyContentOverrides(containerEl, storeKey) {
      var moduleEls = Array.prototype.slice.call(containerEl.children);
      moduleEls.forEach(function (moduleEl) {
        var modIdx = moduleEl.getAttribute("data-ha-edit-module");
        var leaves = collectLeaves(moduleEl);
        leaves.forEach(function (leaf, leafIdx) {
          var leafKey = storeKey + "::" + modIdx + "::" + leafIdx;
          if (contentStore[leafKey] != null && !leaf.classList.contains("ha-edit-editing")) {
            leaf.textContent = contentStore[leafKey];
          }
          leaf.setAttribute("data-ha-edit-leaf-key", leafKey);
        });
      });
    }

    function setupDragHandles(containerEl) {
      if (containerEl.__haSortable) {
        containerEl.__haSortable.destroy();
        containerEl.__haSortable = null;
      }
      Array.prototype.forEach.call(containerEl.children, function (child) {
        var handle = child.querySelector(":scope > [data-ha-edit-handle]");
        if (editMode) {
          if (!handle) {
            handle = document.createElement("span");
            handle.setAttribute("data-ha-edit-handle", "");
            handle.setAttribute("contenteditable", "false");
            handle.className = "ha-edit-handle";
            handle.textContent = "\u28FF";
            child.insertBefore(handle, child.firstChild);
          }
        } else if (handle) {
          handle.remove();
        }
      });
      if (window.Sortable) {
        containerEl.__haSortable = window.Sortable.create(containerEl, {
          handle: "[data-ha-edit-handle]",
          animation: 150,
          disabled: !editMode,
          ghostClass: "ha-edit-sortable-ghost",
          dragClass: "ha-edit-sortable-drag",
          onEnd: function () {
            var order = Array.prototype.slice.call(containerEl.children).map(function (c) {
              return c.getAttribute("data-ha-edit-module");
            });
            var storeKey = containerEl.__haStoreKey;
            if (storeKey) {
              orderStore[storeKey] = order;
              saveJSON(STORAGE_ORDER, orderStore);
            }
          },
        });
      }
    }

    function applyContainer(containerEl) {
      var root = document.getElementById("ha-root");
      var pageKey = pageKeyFor(root);
      var cKey = containerKeyFor(containerEl);
      var storeKey = pageKey + "::" + cKey;
      containerEl.__haStoreKey = storeKey;

      applyOrder(containerEl, storeKey);
      applyContentOverrides(containerEl, storeKey);
      setupDragHandles(containerEl);
    }

    function applyEditLayer() {
      var root = document.getElementById("ha-root");
      if (!root) return;
      var containers = root.querySelectorAll(MODULE_CONTAINER_SELECTOR);
      Array.prototype.forEach.call(containers, applyContainer);
    }

    function startEditing(leaf) {
      if (leaf.classList.contains("ha-edit-editing")) return;
      leaf.setAttribute("contenteditable", "true");
      leaf.classList.add("ha-edit-editing");
      leaf.focus();
      var range = document.createRange();
      range.selectNodeContents(leaf);
      range.collapse(false);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function finishEditing(leaf) {
      leaf.removeAttribute("contenteditable");
      leaf.classList.remove("ha-edit-editing");
      var key = leaf.getAttribute("data-ha-edit-leaf-key");
      if (key) {
        contentStore[key] = leaf.textContent;
        saveJSON(STORAGE_CONTENT, contentStore);
      }
    }

    document.addEventListener(
      "dblclick",
      function (e) {
        if (!editMode) return;
        var leaf = e.target.closest("[data-ha-edit-leaf-key]");
        if (!leaf) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        startEditing(leaf);
      },
      true,
    );

    document.addEventListener(
      "click",
      function (e) {
        var root = document.getElementById("ha-root");
        if (!editMode || !root) return;
        var editing = document.querySelector(".ha-edit-editing");
        if (editing && !editing.contains(e.target)) {
          finishEditing(editing);
        }
        if (root.contains(e.target)) {
          if (e.target.closest("[data-ha-edit-handle]")) return;
          var actionEl = e.target.closest("[data-action]");
          if (actionEl && !actionEl.classList.contains("ha-edit-editing")) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }
      },
      true,
    );

    document.addEventListener(
      "keydown",
      function (e) {
        var editing = document.querySelector(".ha-edit-editing");
        if (!editing) return;
        if (e.key === "Enter" || e.key === "Escape") {
          e.preventDefault();
          finishEditing(editing);
        }
      },
      true,
    );

    function ensureToggleButton() {
      if (document.getElementById("ha-edit-toggle")) return;
      var btn = document.createElement("button");
      btn.id = "ha-edit-toggle";
      btn.type = "button";
      btn.className = "ha-edit-toggle-btn";
      btn.textContent = "\u270F\uFE0F 编辑模式";
      btn.addEventListener("click", function () {
        editMode = !editMode;
        document.body.classList.toggle("ha-edit-mode", editMode);
        btn.textContent = editMode ? "\u2705 完成编辑" : "\u270F\uFE0F 编辑模式";
        applyEditLayer();
      });
      document.body.appendChild(btn);
    }

    function boot() {
      var root = document.getElementById("ha-root");
      if (!root) {
        requestAnimationFrame(boot);
        return;
      }
      ensureToggleButton();
      applyEditLayer();
      var observer = new MutationObserver(function () {
        requestAnimationFrame(applyEditLayer);
      });
      observer.observe(root, { childList: true });
    }

    boot();
  })();
</script>

  </body>
</html>
